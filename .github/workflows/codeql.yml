# CodeQL static analysis — the first SAST this repository has run. `Q-R53` has
# asked for it since it was written; `tooling.md` described the scope as "the
# repos whose language or workflow surface it can analyse", which read as a
# judgement somebody had made. Five repositories had simply never had it
# (lemonfiber/spec#358), and nothing in the pipeline said so — `spec-check`,
# `hygiene` and `security` all pass in a repository with no SAST, because none
# of them asks whether there is any.
#
# `actions` only, and that is a limit rather than a choice. CodeQL does not
# analyse PHP at all, so the application code here is out of its reach whatever
# this file says. Swift and Kotlin it does analyse, and this repository
# carries both — but each needs its platform toolchain and a real build in
# CI, which is a project rather than a file, and is recorded in #358 rather
# than pretended to here. The workflows are not out of its reach, and they are
# where injection and supply-chain flaws live: every workflow here calls a
# reusable one with a token.
name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 2"
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          languages: actions
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          # Named by hand, because GitHub builds a category from the *matrix* and
          # there is none here: a single-language job with no `category:` is
          # recorded as `.github/workflows/codeql.yml:analyze`, with no language
          # in it at all. The gate below compares what was analysed against what
          # this file says is meant to be, and a category naming no language
          # answers for no language.
          category: "/language:actions"

  # The analysis finding something is not the same as anything stopping it. The
  # check GitHub raises beside it compares the configurations a pull request
  # produced against every one seen on `main`, and the supply-chain scan uploads
  # three that only ever run on `main` — so it is neutral on every pull request,
  # whatever the analysis found, and gates nothing. This asks the question that
  # was meant: is there an open alert against what this branch proposes.
  #
  # `!cancelled()` rather than `always()`, and rather than `needs:` alone: a
  # `needs:` dependency that fails makes this job vanish, and a skipped required
  # check satisfies branch protection — so the one gate that refuses an alert
  # would be absent in exactly the case where the analysis went wrong. A
  # cancelled run is somebody pressing stop, and finishing the job they stopped
  # serves nobody. The gate refuses a commit it has no analysis of, by language
  # and by name, so running it after a failed analysis says what is missing
  # rather than passing on an empty list.
  alerts:
    needs: analyze
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      security-events: read
    uses: lemonfiber/spec/.github/workflows/codeql-alerts.yml@83f44c7db1d225172c5d79d33ac83663224aabba # main
    with:
      analysis: ${{ needs.analyze.result }}
