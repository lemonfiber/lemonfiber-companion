name: sonar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # The gate below edits one sticky verdict comment on the pull request.
  pull-requests: write

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'
  # See `ci.yml` for why this is here: the local-notifications plugin comes
  # from a private Composer repository and an install without the credential
  # fails with `402`.
  COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

# Separate from `ci` on purpose.
#
# Sonar needs a token, which means it cannot run on a pull request from a fork,
# and it needs a coverage report, which means a coverage driver and a full test
# run. Folding it into the `checks` job would make every gate in that job wait
# for pcov and then fail for everyone without the secret. Here it can be
# skipped cleanly and the rest of CI carries on.

jobs:
  sonar:
    name: sonarcloud
    # A fork has no access to the token, and a job that cannot authenticate
    # should not report a red tick that nobody can fix.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar reads history to attribute an issue to the change that
          # introduced it, which is what makes "new code" a usable gate.
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: coverage and test report
        run: composer test:report

      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        id: scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Runs when the scan failed, and asks the one question its output does not
      # answer: was that this repository or the host?
      #
      # A scanner that cannot reach SonarCloud fails with a Spring bean-creation
      # trace forty lines deep and `Error 503` somewhere in the middle, and the
      # required check beside it goes red exactly as it does for a real finding.
      # On 2026-09-13 SonarCloud answered 503 for over an hour and fourteen pull
      # requests across the organisation sat blocked behind a stack trace nobody
      # had read to the middle of.
      #
      # It reports and changes nothing: the scan still failed, the check is still
      # red, and `Q-R64` was still not enforced on this run. What it adds is the
      # sentence that says which of those two things happened.
      - name: Whether SonarCloud was answering
        if: always() && steps.scan.outcome == 'failure'
        run: |
          set -uo pipefail
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 \
            https://sonarcloud.io/api/system/status 2>/dev/null || echo "000")

          # 000 is curl reaching nothing at all, which is the same news as a 5xx
          # for the purpose of this sentence.
          case "$code" in
          5?? | 000)
            said="The scan failed and SonarCloud answered ${code} to a plain status request, so the host was unavailable rather than this pull request being at fault. Coverage and the test report ran above either way. Re-run this job once sonarcloud.io is answering — nothing on this run enforced Q-R64."
            ;;
          *)
            said="The scan failed and SonarCloud answered ${code} to a plain status request, so the host was reachable and the failure is in this run rather than an outage. Read the scanner output above. Nothing on this run enforced Q-R64."
            ;;
          esac

          echo "::notice::${said}"
          printf '### Why the SonarCloud scan failed\n\n%s\n' "$said" >> "$GITHUB_STEP_SUMMARY"

  # Q-R64 — the check this repository was the only one in the estate without.
  #
  # The scan above produces the analysis; nothing here read it. SonarCloud's free
  # plan cannot express "zero issues" as a quality gate condition, so a green
  # `SonarCloud Code Analysis` tick means the *quality gate* passed, not that the
  # project is clean — and this repository merged a pull request with two issues
  # standing open under exactly that tick. `php:S1186` on an empty constructor and
  # `php:S1142` on a method with four returns, both reported, both unread, because
  # no check in this repository ever asked for the number.
  #
  # Every other repository here calls the shared reusable in `spec`, which asks
  # both questions Q-R64 needs — new issues on this pull request, and open issues
  # against the project — and blocks on either. One definition, so a repository
  # cannot drift into gating differently from its neighbours, and so a fix to the
  # gate reaches all of them at once.
  gate:
    # No `name:`, deliberately. The required-check context is built from the job
    # ids — `gate / gate` — and every other repository here is protected under
    # exactly that string. A display name would rename the context and leave
    # this repository's branch protection pointing at a check that never
    # reports, which is the same hole this file exists to close.
    #
    # After the scan, so there is a summary to read. Without this the gate polls
    # for a comment the scan has not been started to produce yet and spends its
    # whole timeout waiting for one.
    needs: sonar
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/sonar-gate.yml@a269e7f347ed92988cbf03394130b6fee93347da # main
    with:
      # Nothing, which is now true: `main` carries zero open issues, and the two
      # it did carry went out with the commit that installed this gate.
      #
      # This is what the previous value was for. `allowed-open` is a ceiling and
      # not a budget — the shared gate refuses any raise past the count actually
      # standing against the base branch — so a repository installs the gate at
      # whatever it inherited and walks it down. Two was the honest number for
      # one merge; zero is the honest number now, and from here the gate refuses
      # the first issue rather than the first issue past a tolerance.
      allowed-open: 0
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
