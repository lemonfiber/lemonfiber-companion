# Take the client, so that nobody else has to.
#
# `sdk-drift` is a required check here, and it compares the reference
# `composer.lock` pins for `lemonfiber/sdk-php` against that repository's main.
# That is what `Q-R68` asks for, and it has a cost nothing was paying down:
# every commit on the client turns every open pull request here red, including
# ones that touch nothing near it. An author who came to add a rule is handed a
# dependency bump.
#
# It happened on this repository's first day, twice, to the pull request that
# introduced the gate. The gate was right both times. The gate is not the thing
# to change.
#
# So this does the bump. `sdk-moved` in the client fires it on every push to the
# client's main, and it opens — or updates — one pull request that takes the
# client. What an author sees then is a check that is already green, or a pull
# request from the bot sitting beside their own with the reason in it.
#
# It merges itself only when the analyser and the suite still pass. A client
# that changes a shape this surface uses is a change here rather than a bump,
# and that is not a thing to merge unread.
name: sdk-bump

on:
  # How the client asks, on every push to its main.
  workflow_dispatch:
  # The floor, for a dispatch that never arrived.
  schedule:
    - cron: "20 8 * * 1"

permissions:
  contents: read

concurrency:
  # One bump at a time: two runs would each reset the branch under the other.
  group: sdk-bump
  cancel-in-progress: false

env:
  BRANCH: chore/the-companion-takes-the-client
  SDK: lemonfiber/sdk-php
  PACKAGE: lemonfiber/sdk-php
  # Without this the install cannot reach the paid plugin repository and stops
  # at HTTP 401, which is not a failing gate — it is no gate at all. `ci.yml`,
  # `sonar.yml` and `sdk-drift.yml` all carry it; this one did not, so every
  # bump it has ever opened said the analyser failed when the analyser had not
  # run.
  COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # `main` requires signed commits and only commits GitHub makes are signed,
      # and a pull request opened with `GITHUB_TOKEN` triggers no workflows — so
      # its required checks would never report and it could never merge. Both
      # reasons want an app token.
      - name: Mint a token that can open a pull request here
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is the lock behind at all
        id: behind
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          pin="$(python3 - <<'PY'
          import json
          import sys

          with open("composer.lock", encoding="utf-8") as handle:
              lock = json.load(handle)
          for package in lock.get("packages", []) + lock.get("packages-dev", []):
              if package.get("name") == "lemonfiber/sdk-php":
                  print(package.get("source", {}).get("reference", ""))
                  break
          else:
              sys.exit("lemonfiber/sdk-php is not in composer.lock")
          PY
          )"
          head="$(gh api "repos/${SDK}/commits/main" --jq .sha)"
          echo "pin=${pin}" >> "$GITHUB_OUTPUT"
          echo "head=${head}" >> "$GITHUB_OUTPUT"
          if [ "$pin" = "$head" ]; then
            echo "moved=no" >> "$GITHUB_OUTPUT"
            echo "## The companion is already on the client's main" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            echo "moved=yes" >> "$GITHUB_OUTPUT"
            echo "Locked ${pin}; the client's main is ${head}."
          fi

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        if: steps.behind.outputs.moved == 'yes'
        with:
          php-version: '8.5'
          coverage: none

      # Split from the gates below, because "the gates failed" and "the gates
      # could not run" are different news and were being reported as the same.
      # An update that could not resolve leaves nothing checked, and saying the
      # client changed a shape on the strength of it sends the reader hunting a
      # change that is not there.
      - name: Take the client
        id: install
        if: steps.behind.outputs.moved == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          # It moves the lock, installs from it, and runs the scripts. The
          # scripts matter here — Laravel's package discovery is a
          # `post-autoload-dump` hook, so skipping them leaves an application
          # that cannot boot and an analyser run that means nothing.
          #
          # What composer said is kept, because the pull request used to guess.
          # It named HTTP 401 whatever had happened, and on 2026-09-13 what had
          # actually happened was a resolver conflict it printed in full: this
          # client required guzzle 7 and the lock here holds 8, so no update was
          # possible at all. A reader told "401" goes looking at a registry.
          composer update "${PACKAGE}" --no-interaction 2>&1 | tee composer-said.txt
          exit "${PIPESTATUS[0]}"

      - name: Check it still holds
        id: build
        if: steps.behind.outputs.moved == 'yes' && steps.install.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          composer analyse
          composer test

      - name: Put the change on the branch, signed
        id: commit
        if: steps.behind.outputs.moved == 'yes'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PIN: ${{ steps.behind.outputs.pin }}
          HEAD_SHA: ${{ steps.behind.outputs.head }}
          CLEAN: ${{ steps.build.outcome }}
          INSTALLED: ${{ steps.install.outcome }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # A lock that did not move is nothing to take. `composer update`
          # leaves it untouched when it cannot resolve, and this used to commit
          # it anyway and open a pull request titled "take sdk-php c28b7ea" with
          # no files in it — a bump that says it took something and took
          # nothing, which is worse than no pull request because somebody has to
          # read it to find that out.
          if git diff --quiet -- composer.lock; then
            echo "::warning::composer.lock is unchanged, so there is nothing to take. The update did not move it — read the step above for why."
            echo "moved=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "moved=yes" >> "$GITHUB_OUTPUT"

          base="$(gh api "repos/${REPO}/commits/main" --jq .sha)"

          # Asked *before* the reset, because after it the answer cannot be
          # trusted. Resetting the branch closes whatever pull request is open
          # on it, and GitHub does that asynchronously: a read a moment later is
          # still answered with the pull request that is on its way to closed.
          # The step below believed that answer twice on 2026-09-22 — it logged
          # `#298 updated` and `#300 updated`, opened nothing either time, and
          # left each commit on a branch whose pull request was shut. `sdk-drift`
          # is required here, so both times that was every pull request in the
          # repository red, with nothing saying why.
          #
          # Carried forward as a number rather than re-derived, so the reopen
          # below does not depend on what GitHub has got round to.
          # Built on a scratch ref and moved across in one step, rather than
          # resetting the pull request's own branch to main first.
          #
          # The reset is what the branch needs — it is the bot's alone, and
          # carrying yesterday's bump under today's would describe two changes
          # as one — but doing it in place leaves the branch briefly equal to
          # `main`, and GitHub closes a pull request whose branch holds no
          # commits ahead of its base. That is not a hazard in the abstract: it
          # shut `#298` at 17:32 and `#300` at 17:56 on 2026-09-22, and because
          # the run then read `--state open` before GitHub had finished closing
          # them, it reported `#N updated` and opened nothing either time. With
          # `sdk-drift` required here, each occurrence was every pull request in
          # the repository red for a bump nobody could see was missing.
          #
          # `lemonfiber-web` met the same thing and answered it this way; this
          # is that answer, not a second one. Building elsewhere and moving the
          # branch straight from yesterday's commit to today's means it is never
          # equal to `main`, so nothing closes and the number people have
          # commented on survives.
          staging="${BRANCH}-staging"
          if gh api "repos/${REPO}/git/ref/heads/${staging}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${REPO}/git/refs/heads/${staging}" \
              -F sha="${base}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${REPO}/git/refs" \
              -f ref="refs/heads/${staging}" -f sha="${base}" >/dev/null
          fi

          if [ "$INSTALLED" != "success" ]; then
            body="The client could not be installed, so nothing was checked against it — this is not a verdict on the client."
          elif [ "$CLEAN" = "success" ]; then
            body="The analyser and the suite still pass against it."
          else
            body="The analyser or the suite did not pass against it, so this is a change here rather than a bump. Read it before merging."
          fi

          # The request goes in a file, not in an argument. A lockfile's base64
          # is hundreds of kilobytes and the first version of this passed it on
          # the command line, where it died on `Argument list too long` — after
          # the rebuild had already succeeded, which is the worst place to fail.
          #
          # Building the JSON in Python also means the message and the file
          # contents are encoded rather than quoted into place by hand.
          python3 - "$REPO" "$staging" "$base" "$HEAD_SHA" "$PIN" "$body" <<'PY' >request.json
          import base64
          import json
          import sys

          repo, branch, base, head, pin, note = sys.argv[1:7]
          files = ["composer.lock"]

          print(json.dumps({
              "query": (
                  "mutation($input: CreateCommitOnBranchInput!) "
                  "{ createCommitOnBranch(input: $input) { commit { oid } } }"
              ),
              "variables": {
                  "input": {
                      "branch": {
                          "repositoryNameWithOwner": repo,
                          "branchName": branch,
                      },
                      "expectedHeadOid": base,
                      "message": {
                          "headline": f"chore(sdk): take sdk-php {head[:7]}",
                          # commitlint, dco and spec-check each read this, and
                          # spec-check closes a pull request whose citation it
                          # cannot resolve.
                          "body": (
                              f"The companion reaches a stack through this client and nothing else, so a client it has not taken is a fact about this repository. {note}\n\n"
                              f"Was {pin}.\n\n"
                              "Signed-off-by: lemonfiber release <release@lemonfiber.app>\n"
                              "Spec: Q-R68"
                          ),
                      },
                      "fileChanges": {
                          "additions": [
                              {
                                  "path": name,
                                  "contents": base64.b64encode(
                                      open(name, "rb").read()
                                  ).decode(),
                              }
                              for name in files
                          ]
                      },
                  }
              },
          }))
          PY

          built="$(gh api graphql --input request.json \
            --jq '.data.createCommitOnBranch.commit.oid')"

          if ! printf '%s' "$built" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::the commit was not created; got '${built}'"
            exit 1
          fi

          # One move, so the branch goes from yesterday's commit to today's
          # without ever being equal to `main`.
          if gh api "repos/${REPO}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${REPO}/git/refs/heads/${BRANCH}" \
              -F sha="${built}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${REPO}/git/refs" \
              -f ref="refs/heads/${BRANCH}" -f sha="${built}" >/dev/null
          fi

          # The scratch ref has done its job. Left behind it would show up in
          # the branch list as something a reader has to work out.
          gh api --method DELETE "repos/${REPO}/git/refs/heads/${staging}" >/dev/null 2>&1 || true

          echo "clean=${CLEAN}" >> "$GITHUB_OUTPUT"
          echo "installed=${INSTALLED}" >> "$GITHUB_OUTPUT"

      - name: Open the pull request, or leave the open one updated
        if: steps.behind.outputs.moved == 'yes' && steps.commit.outputs.moved == 'yes'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PIN: ${{ steps.behind.outputs.pin }}
          HEAD_SHA: ${{ steps.behind.outputs.head }}
          CLEAN: ${{ steps.commit.outputs.clean }}
          INSTALLED: ${{ steps.commit.outputs.installed }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$INSTALLED" != "success" ]; then
            # What composer said, rather than a guess at it. Trimmed to the
            # resolver's own explanation where there is one — the paragraph
            # after "could not be resolved" is the part that names the packages
            # — and to the last lines otherwise.
            #
            # `grep -A` rather than a sed range to the last line. That range
            # needs sed's last-line address inside single quotes, and shellcheck
            # reads it as a variable that will not expand — correctly, because
            # the two are written identically. This says the same thing in a
            # spelling neither of them can misread.
            said="$(grep -A20 'could not be resolved' composer-said.txt 2>/dev/null || true)"
            if [ -z "$said" ]; then
              said="$(tail -20 composer-said.txt 2>/dev/null || echo 'composer wrote nothing this workflow kept.')"
            fi
            # Double-quoted, so shellcheck can see that `\n` and the fences are
            # meant literally rather than as something that failed to expand.
            verdict="$(printf "%s\n\n\`\`\`\n%s\n\`\`\`" \
              "**Nothing was checked against this client.** \`composer update\` did not complete, so neither the analyser nor the suite ran and **\`Q-R68\` was not enforced on this run**. That is this workflow's problem or the registry's, not a verdict on the client, and what composer said is below rather than summarised — an earlier version of this step named HTTP 401 whatever had happened, which sent readers to a registry that was working." \
              "${said}")"
          elif [ "$CLEAN" = "success" ]; then
            verdict="**\`composer analyse\` and the suite still pass.** Nothing this surface uses changed shape."
          else
            verdict="**The analyser or the suite did not pass.** The client has changed a shape this surface uses, so taking it is a change here rather than a bump. Read the failing run before merging; do not force it green."
          fi

          # Read plainly, because the branch was never equal to `main` and so
          # nothing closed the pull request on it. This read was unsafe while
          # the branch was reset in place — it answered with a pull request
          # already on its way to closed — and it is safe now for the same
          # reason the reset moved to a scratch ref.
          #
          # The title is rewritten where one is already open. It names a
          # revision, a later run takes a different one, and a pull request
          # whose title says it takes `f866c1c` above a diff taking `7d5c138`
          # is one somebody has to open to find out what it does.
          existing="$(gh pr list --repo "${REPO}" --head "${BRANCH}" --state open --json number --jq '.[0].number // ""')"
          if [ -n "$existing" ]; then
            gh pr edit "${existing}" --repo "${REPO}" \
              --title "chore(sdk): take sdk-php ${HEAD_SHA:0:7}" >/dev/null 2>&1 || true
            echo "::notice::#${existing} updated to ${HEAD_SHA}"
          else
            created="$(gh pr create --repo "${REPO}" --head "${BRANCH}" --base main \
              --title "chore(sdk): take sdk-php ${HEAD_SHA:0:7}" \
              --body "$(printf '%s\n' \
                "\`sdk-drift\` is a required check here, and the lock was behind. This takes the client so that the next author to open a pull request is not handed a dependency bump they did not come for." \
                "" \
                "- was: \`${PIN}\`" \
                "- now: \`${HEAD_SHA}\`" \
                "" \
                "${verdict}" \
                "" \
                "Opened by \`sdk-bump\`, which the client's own \`sdk-moved\` fires on every push to its main." \
                "" \
                "Spec: Q-R68")")"
            # `gh pr create` prints the pull request's URL, not its number.
            existing="${created##*/}"
            echo "::notice::opened #${existing}"
          fi

          if [ "$CLEAN" = "success" ]; then
            gh pr merge "${existing}" --repo "${REPO}" --squash --auto \
              && echo "auto-merge armed on #${existing}." \
              || echo "::warning::could not arm auto-merge on #${existing}; merge it by hand."
          else
            echo "::warning::#${existing} needs reading: the client did not come out clean."
          fi
