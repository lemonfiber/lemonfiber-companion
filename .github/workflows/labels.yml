# Keep this repo's labels in sync with the canonical set in the spec.
#
# They were not. This repository carried twenty-six labels, nobody had compared
# them to anything, and a label the triage automations look for is a label that
# has to exist by name — so a divergence here is not cosmetic, it is a rule that
# quietly stops matching.
name: labels
on:
  workflow_dispatch:
  schedule:
    - cron: "59 4 * * 1"
permissions:
  contents: read
jobs:
  sync:
    permissions:
      contents: read
      issues: write
    uses: lemonfiber/spec/.github/workflows/label-sync.yml@f368b52cac7510f5903f04d8884a27b3c33d0b11 # v1.0.92
