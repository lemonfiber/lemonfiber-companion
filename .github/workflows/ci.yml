name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'
  # The cache key a proven tree is recorded under, before the tree itself. The
  # proof carries the coverage report that proved the tree, so a run that
  # skips the suite on it still hands SonarCloud that tree's coverage.
  PROVED_TREE: ci-proved-tree-with-coverage
  # What lets `composer install` reach `plugins.nativephp.com`.
  #
  # `nativephp/mobile-local-notifications` is a paid first-party plugin served
  # from a private Composer repository, so an install without this credential
  # fails on the download with `402` rather than with anything that names the
  # cause. Set as an organisation secret so every repository in the estate that
  # needs a plugin can reach one without a second place to keep the value.
  #
  # A pull request from a fork is given no secrets, so this is empty there and
  # the install fails. That is the same limitation every paid dependency has and
  # is not something a workflow can route around; the scan job above already
  # skips forks for the same reason.
  COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

# Shaped for cost as much as for correctness.
#
# The obvious layout gives each gate its own job, and each job then pays for a
# checkout, a PHP install and a dependency install before doing about fifteen
# seconds of work. Eleven gates that way is eleven of those preambles, and the
# preamble is most of the bill.
#
# So the fast gates share one job and one install. The tests stay separate
# because they need a coverage driver and genuinely take time, and so do the
# guards, which run the analyser and the suite again as subprocesses.
#
# Mutation testing is not run in CI; `composer test:mutation` runs it locally.

jobs:
  # Which of the following are worth running at all. A documentation change
  # should not start a PHP toolchain, a change to the PHP should not start a
  # macOS runner, and asking costs one checkout.
  scope:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One output per gate this job decides, each named for the job it starts;
    # `code` starts the PHP gates. The step below writes every one of them.
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
      proved: ${{ steps.proved.outputs.cache-hit }}
      code: ${{ steps.diff.outputs.code }}
      typecheck: ${{ steps.diff.outputs.typecheck }}
      kotlin: ${{ steps.diff.outputs.kotlin }}
      swift: ${{ steps.diff.outputs.swift }}
      agreement: ${{ steps.diff.outputs.agreement }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The tree these gates would test. On a pull request that is the branch
      # merged onto its base, so a rebase that leaves the result byte for byte
      # as it was — a stacked branch whose base was squash-merged, a base that
      # moved only where the branch already agreed — names the same tree. A
      # tree every gate already passed on is not tested again: the gates take
      # the path a documentation change takes, and SonarCloud reads the
      # coverage report the proof carries. The proof is recorded by
      # `proved-tree` below, only once every gate passed on it, and a branch can
      # read its own proofs and `main`'s, never another branch's.
      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - id: proved
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-proved
          key: ${{ env.PROVED_TREE }}-${{ steps.tree.outputs.tree }}
          lookup-only: true
      - id: diff
        env:
          PROVED: ${{ steps.proved.outputs.cache-hit }}
          TREE: ${{ steps.tree.outputs.tree }}
          # What this branch is measured against: a pull request's base, and on
          # a push to `main` the commit before it, so a push of documentation
          # alone starts no PHP gate there either.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # Every gate this job decides, and the only list of them. Each stays
          # false until a changed path names it.
          declare -A run=([code]=false [typecheck]=false [kotlin]=false [swift]=false [agreement]=false)
          every() {
            for gate in "${!run[@]}"; do run[${gate}]=$1; done
          }
          decided() {
            for gate in "${!run[@]}"; do echo "${gate}=${run[${gate}]}"; done >> "$GITHUB_OUTPUT"
          }
          if [ "${PROVED}" = true ]; then
            echo "Every gate already passed on tree ${TREE}; none is run again." | tee -a "$GITHUB_STEP_SUMMARY"
            decided
            exit 0
          fi
          # No base to compare against means run everything rather than guess.
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            every true
            decided
            echo "No usable base commit, so every gate runs."
            exit 0
          fi
          changed="$(git diff --name-only "${BASE}" HEAD)"
          nativephp() {
            git show "$1:composer.lock" 2>/dev/null \
              | jq -c '.packages[]? | select(.name == "nativephp/mobile")' || true
          }
          while IFS= read -r path; do
            # What each bridge gate reads, one row per gate. `;;&` tests the
            # next row as well, so one path can start several gates.
            #
            # `typecheck` compiles every Swift file the bridge ships against
            # the locked `nativephp/mobile` as `scripts/patch_nativephp.php`
            # patches it. `swift` lints, builds and tests the Swift package, and
            # `kotlin` the Gradle project, whose ktlint reads the root
            # `.editorconfig` as well as the bridge's own. `agreement` reads
            # the two test trees.
            case "${path}" in
            bridge/resources/ios/* | scripts/typecheck_native.sh | scripts/patch_nativephp.php) run[typecheck]=true ;;&
            bridge/resources/ios/* | bridge/ios/* | bridge/Package.swift | bridge/.swift-format) run[swift]=true ;;&
            bridge/resources/android/* | bridge/android/* | bridge/.editorconfig | .editorconfig) run[kotlin]=true ;;&
            bridge/android/src/test/kotlin/* | bridge/ios/Tests/*) run[agreement]=true ;;&
            composer.lock)
              if [ "$(nativephp "${BASE}")" != "$(nativephp HEAD)" ]; then
                run[typecheck]=true
              fi
              ;;
            esac
            # Anything that is not documentation is treated as code. The list is
            # deliberately short: a new kind of file defaults to running the gates.
            # A Markdown file is documentation wherever it sits, a module's
            # README as much as the root's; the one suite that reads Markdown is
            # Arch, and `rules` runs it on every change.
            #
            # Under `.github/`, only this file runs the gates this job decides,
            # so a change to any other file there starts none of them. A change
            # to this file starts every one of them, except where every line it
            # changes is a pin on a shared workflow from `lemonfiber/spec`:
            # those jobs run none of these gates.
            case "${path}" in
            '' | .docs/* | *.md | LICENSE) continue ;;
            .github/workflows/ci.yml)
              # Every changed line that is not a pin, read to the end. A
              # `grep -q` here would stop at the first such line, the writers
              # before it would die of SIGPIPE, and `pipefail` would turn that
              # into "no such line": a change to how the gates run would skip
              # them.
              moved="$(git diff -U0 "${BASE}" HEAD -- "${path}" \
                | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' \
                | grep -vE '^[-+][[:space:]]*uses: lemonfiber/spec/\.github/workflows/[^@]+@[0-9a-f]{40}( # .*)?$' || true)"
              if [ -n "${moved}" ]; then
                every true
              fi
              ;;
            .github/*) continue ;;
            *) run[code]=true ;;
            esac
          done <<< "${changed}"
          decided
          if [ "${run[code]}" = false ]; then
            echo "Documentation, and workflows that run no PHP gate; the PHP gates are skipped."
          fi

  # The gates every repository in the org shares, defined once in the spec repo
  # and pinned by commit. Those needing a pull request are guarded, because this
  # workflow also runs on pushes to main.
  #
  # `dco` and `attribution` are not guarded: each reads a pull request's
  # base..head off the event. On a push to `main` there is no range, and each
  # says `no PR range; skipping` in its own log before passing: a reported pass
  # rather than a silent one.
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@d7f5d8d7e0c6fbbd8022f94ea48abcd59a518989 # v1.0.34

  # Beside `dco` because the two read the same record from opposite directions:
  # that one insists a human attested to the work, this one insists no tool is
  # credited for it (`GOV-R46`). Unguarded for `dco`'s reason — it is shaped the
  # same way: it checks a pull request's range, and says "no PR range;
  # skipping" on a push to main.
  attribution:
    uses: lemonfiber/spec/.github/workflows/attribution.yml@d7f5d8d7e0c6fbbd8022f94ea48abcd59a518989 # v1.0.34

  # `pull-requests: write` is what lets the gate close a pull request whose
  # citation is missing or names an identifier that does not exist, rather than
  # only going red at it. The workflow-level `contents: read` above is the
  # default for a job that declares nothing; a job-level block replaces that
  # default outright, so `contents: read` is restated here rather than inherited.
  spec-check:
    # `push` stays out: `main` does not require this context.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@d7f5d8d7e0c6fbbd8022f94ea48abcd59a518989 # v1.0.34

  commitlint:
    # `push` stays out: `main` does not require this context, so no name is
    # waiting to be reported there and the runner would be spent for nothing.
    if: github.event_name == 'pull_request'
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@d7f5d8d7e0c6fbbd8022f94ea48abcd59a518989 # v1.0.34

  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@d7f5d8d7e0c6fbbd8022f94ea48abcd59a518989 # v1.0.34

  # Every pin this repository holds on a shared workflow, against what the
  # spec's default branch holds now. It fails naming the commits a pin has not
  # taken; a run that could not ask which they are says so rather than reporting
  # clean.
  #
  # `hygiene` above asks a different question and passing it is not this passing:
  # that one reads the workflows as files, and this one measures each pin against
  # the history of the file it names. Without it a pin rots with nothing to say
  # so, which is how the `sonar-gate` pin came to be a commit behind and stayed
  # there until another repository's gate found it.
  #
  # **Reporting here, not gating, and that is a deferral rather than an
  # oversight.** `Q-R68` asks for this to be a required check on the default
  # branch and it is not one here. `Q-R71` is the form that admission takes, so
  # it is taken in full:
  #
  # - *The reason.* The remedy for a red run is a pin bump, and nothing opens
  #   one in lockstep across the org. Made required before that exists, the gate
  #   blocks its own cure: the bump is itself a pull request, and it arrives at a
  #   default branch where every pull request is already red for wanting it.
  # - *The work it waits on.* `OPS-R48` — the automated pull request that bumps
  #   every consumer when these workflows move. Dependabot covers part of it
  #   here, daily and with `lemonfiber/spec*` claimed ahead of the wildcard, but
  #   it proposes whatever tag existed when it ran, so a proposal can land
  #   already behind a tag published after it was computed. That is the gap, and
  #   it is not one a schedule closes.
  # - *When it is reviewed.* 2026-12-22, or the day `OPS-R48` lands, whichever
  #   comes first.
  #
  # On 2026-09-22 the argument stopped being hypothetical: a tag moved one line
  # of `scorecard.yml` and nine of the ten repositories that pin it went red at
  # once. The nine that require this check could merge nothing until each was
  # bumped by hand. This repository could still merge, which is the whole of what
  # the deferral buys and the whole of why it is written down rather than left to
  # look like a repository nobody finished configuring.
  workflow-pins:
    uses: lemonfiber/spec/.github/workflows/workflow-pins.yml@d7f5d8d7e0c6fbbd8022f94ea48abcd59a518989 # v1.0.34

  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@d7f5d8d7e0c6fbbd8022f94ea48abcd59a518989 # v1.0.34

  labeler:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@d7f5d8d7e0c6fbbd8022f94ea48abcd59a518989 # v1.0.34

  # The rules, before anything slower gets a chance to hide a boundary break.
  #
  # Arch and Templates read files and need neither a coverage driver nor a
  # database, so this is the cheapest job here and the one most likely to fail on
  # a change that is wrong rather than merely broken. Failing it first means a
  # reviewer sees "this crosses a module boundary" rather than a coverage number.
  rules:
    name: rules
    # Every change, documentation included. `tests/Arch` reads ARCHITECTURE.md
    # and `.docs/requirements/` against the code, so a documentation change is
    # exactly the change that can break it — and at about a minute it costs
    # less than any condition would save.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: vendor/bin/pest --testsuite=Arch,Templates

  # R2 — every rule refuses a planted violation.
  #
  # Its own job because it runs the analyser and the test suite as subprocesses,
  # once each, which is a full framework boot twice over. It plants into a copy
  # of the checkout under the runner's temporary directory, never into the
  # checkout itself.
  guards:
    name: the rules refuse violations
    needs: scope
    # `scope` deciding "no code changed" is a skip, and the gates are scoped so
    # that a documentation change does not start a PHP toolchain. `scope`
    # *failing* produces the same skip — a checkout that broke or a runner that
    # died leaves no output, and no output is not a "no".
    #
    # Either way that is wrong. If a skipped required check satisfies branch
    # protection, a pull request merges with none of these run and nothing red.
    # If it does not, the check never reports and the pull request is blocked
    # forever with nothing anywhere naming the cause. The job's own comments say
    # which way it means to fail — "No usable base commit, so every gate runs",
    # "a new kind of file defaults to running the gates" — and its own failure
    # was the one path that did the opposite.
    #
    # So the condition asks the result as well as the output.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    # The planted suite takes four to eight minutes on a hosted runner, and a
    # slow runner has taken ten. Fifteen leaves that room without letting a hung
    # run hold a runner the org's other jobs are queued for.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer test:guards

  # Formatting, static analysis, dead idioms, the repository's own guards and
  # dependency hygiene. One install, one PHP, six commands, no coverage driver.
  checks:
    name: checks
    needs: scope
    # `scope` deciding "no code changed" is a skip, and the gates are scoped so
    # that a documentation change does not start a PHP toolchain. `scope`
    # *failing* produces the same skip — a checkout that broke or a runner that
    # died leaves no output, and no output is not a "no".
    #
    # Either way that is wrong. If a skipped required check satisfies branch
    # protection, a pull request merges with none of these run and nothing red.
    # If it does not, the check never reports and the pull request is blocked
    # forever with nothing anywhere naming the cause. The job's own comments say
    # which way it means to fail — "No usable base commit, so every gate runs",
    # "a new kind of file defaults to running the gates" — and its own failure
    # was the one path that did the opposite.
    #
    # So the condition asks the result as well as the output.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .phpstan-cache
            .rector-cache
          key: analysis-${{ runner.os }}-${{ github.sha }}
          restore-keys: analysis-${{ runner.os }}-
      # Cheapest first, so a misplaced brace fails in seconds rather than after
      # the analyser has walked the tree.
      - run: composer validate --strict
      - run: composer validate:modules
      - run: composer normalize --dry-run
      - run: composer normalize:modules
      - run: composer lint
      - run: composer analyse
      - run: composer refactor
      - run: composer deps
      - run: composer audit

  # The bridge's own gates: its Kotlin and its Swift, held to the bar the PHP
  # is, and the two held to each other.
  #
  # Each runs only where `scope` says what it reads moved, and that is about
  # cost. The Swift gates need a macOS runner, which bills at ten times an
  # ubuntu one, so a formatting fix on a Blade template must not start one.
  #
  # They are skipped by an `if:` rather than kept out by a `paths:` filter on a
  # workflow of their own, because each is a required check. A job skipped by
  # its `if:` takes no runner and still reports, and branch protection reads
  # the skip as a pass. A workflow a `paths:` filter keeps from starting reports
  # nothing, and a required check that never reports holds the pull request
  # forever. Each condition asks the result as well as the output, for the
  # reason `guards` gives.
  #
  # There is no build of the plugin, because there is nothing to build: what
  # ships is a directory of sources the NativePHP builder copies into a host
  # app. What can be checked without a device is the decision those sources
  # make — each rule, in both languages — and that every Swift file compiles
  # for iOS, and that is what these run.

  # Every Swift file the bridge ships, compiled for iOS against the NativePHP
  # sources installed beside it. `swift` builds only the files that need no
  # iOS runtime; the rest meet a compiler here, or else first in the app build.
  # The bridge's Kotlin is not compiled by this job: see
  # `scripts/typecheck_native.sh`.
  typecheck:
    name: the bridge compiles for iOS
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.typecheck == 'true') }}
    # The one macOS image both Swift gates run on, so the harness and the
    # typecheck read the same sources with the same compiler.
    runs-on: &swift-runner macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      # The NativePHP sources the bridge is compiled against, as the lock
      # installs and `scripts/patch_nativephp.php` patches them.
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: scripts/typecheck_native.sh

  kotlin:
    name: kotlin
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.kotlin == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: bridge/android/.java-version

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.14'

      # In the order a person would want to read them. A formatting finding is
      # cheaper to read than an analyser finding, which is cheaper than a test
      # failure — and each is often the reason for the next.
      #
      # `ktlintCheck` is pint, `detekt` is PHPStan, `test` is pest and
      # `koverVerify` is the 100% floor. The Kotlin compiler runs under all of
      # them with `allWarningsAsErrors` and `explicitApi()` on, which is the
      # nearest thing it has to `declare(strict_types=1)`.
      - name: ktlint, detekt, the decision, and the floor
        working-directory: bridge/android
        run: gradle ktlintCheck detekt test koverVerify --console=plain

  swift:
    name: swift
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.swift == 'true') }}
    runs-on: *swift-runner
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: swift-format
        working-directory: bridge
        run: swift format lint --strict --recursive --configuration .swift-format resources/ios ios

      # The compiler's own findings, made blocking. The counterpart of Kotlin's
      # `allWarningsAsErrors`, passed here rather than set in `Package.swift`
      # because `unsafeFlags` there would make this package unusable as anybody
      # else's dependency.
      - name: build, with warnings blocking
        working-directory: bridge
        run: swift build -Xswiftc -warnings-as-errors

      # Runs the tests and holds the 100% floor in one step, so a suite that
      # passes while covering less cannot be read as green.
      - name: the decision, in Swift, and the floor
        working-directory: bridge
        run: ./ios/coverage.sh

  # The two halves must decide the same thing. Each rule is tested in its own
  # language on each side, and this is what notices if one file grows a case
  # the other does not — which is how two platforms come to disagree about a
  # decision without either looking wrong on its own.
  agreement:
    name: both halves answer the same questions
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.agreement == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: compare the two test files, case for case
        shell: python3 {0}
        run: |
            """Both halves must ask the same questions.

            Written in Python rather than in `sed`, because the patterns that
            pull a test name out of each file are full of regex anchors and
            backticks — and in a shell they are three layers of quoting deep,
            which is how a comparison ends up silently matching nothing and
            reporting agreement.
            """
            import re
            import sys
            from pathlib import Path

            # Every mirrored pair, found rather than listed: a rule added
            # tomorrow with only one half written is exactly what this exists to
            # catch, and a hand-kept list would not know about it.
            #
            # Both trees are globbed, so a suite on either side with no
            # counterpart on the other is found and named. A check that reports
            # agreement by not looking is the failure its own error message
            # describes.
            kotlin = {
                p.stem.removesuffix("Test")
                for p in Path("bridge/android/src/test/kotlin").glob("*Test.kt")
            }
            swift = {
                p.parent.name.removesuffix("Tests")
                for p in Path("bridge/ios/Tests").glob("*Tests/*Tests.swift")
            }

            pairs = [
                (
                    Path("bridge/android/src/test/kotlin") / f"{name}Test.kt",
                    Path("bridge/ios/Tests") / f"{name}Tests" / f"{name}Tests.swift",
                )
                for name in sorted(kotlin | swift)
            ]

            missing = [str(p) for pair in pairs for p in pair if not p.exists()]

            if missing:
                print("::error::A rule is tested on one platform and not the other.")
                for path in missing:
                    print(f"  no such file: {path}")
                sys.exit(1)

            failed = False

            for kotlin_path, swift_path in pairs:
                kotlin = kotlin_path.read_text()
                swift = swift_path.read_text()

                # Compared character for character, with nothing normalised
                # away. A name is a sentence somebody wrote about what the rule
                # decides, and two spellings of one sentence is a pair of files
                # drifting in exactly the way this job exists to notice. Each
                # normalisation added here is also a way for two genuinely
                # different names to compare equal.
                asked = {
                    "kotlin": set(re.findall(r"fun `([^`]+)`", kotlin)),
                    "swift": set(re.findall(r'@Test\("([^"]+)"\)', swift)),
                }

                if asked["kotlin"] == asked["swift"]:
                    print(f"{kotlin_path.stem}: both halves answer the same "
                          f"{len(asked['kotlin'])} questions.")
                    continue

                failed = True
                print(f"::error::{kotlin_path.stem} and {swift_path.stem} no longer "
                      "ask the same questions.")

                for side, other in (("kotlin", "swift"), ("swift", "kotlin")):
                    only = sorted(asked[side] - asked[other])
                    if only:
                        print(f"Only in {side}:")
                        for name in only:
                            print(f"  {name}")

            if failed:
                print()
                print("A rule kept on one platform and not the other is the bug nobody")
                print("finds: each half looks right on its own. Add the missing case")
                print("rather than deleting the one that has no pair.")
                sys.exit(1)

  tests:
    name: tests and coverage
    needs: scope
    # `scope` deciding "no code changed" is a skip, and the gates are scoped so
    # that a documentation change does not start a PHP toolchain. `scope`
    # *failing* produces the same skip — a checkout that broke or a runner that
    # died leaves no output, and no output is not a "no".
    #
    # Either way that is wrong. If a skipped required check satisfies branch
    # protection, a pull request merges with none of these run and nothing red.
    # If it does not, the check never reports and the pull request is blocked
    # forever with nothing anywhere naming the cause. The job's own comments say
    # which way it means to fail — "No usable base commit, so every gate runs",
    # "a new kind of file defaults to running the gates" — and its own failure
    # was the one path that did the opposite.
    #
    # So the condition asks the result as well as the output.
    #
    # It runs on pushes to `main` as well as on pull requests, because `sonar`
    # below reads its report to analyse `main`.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # Writes the clover report the floors gate reads. One run produces both
      # the global number and the seventeen per-tree ones.
      - run: composer test:report
      - run: composer test:floors
      # The same two reports are what `sonar` hands SonarCloud, so the suite
      # runs once for both.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage/clover.xml
            coverage/junit.xml
          if-no-files-found: error
          retention-days: 1

  # SonarCloud, moved here from its own workflow so that it reads the report
  # `tests` writes instead of running the suite a second time.
  sonar:
    name: sonarcloud
    # A fork has no access to the token, and a job that cannot authenticate
    # should not report a red tick that nobody can fix.
    #
    # It reads the report `tests` wrote rather than running the suite again.
    # Where `tests` skipped because every gate already passed on this tree, it
    # reads the report that proved the tree, which the proof carries. Where
    # `tests` skipped because nothing but documentation changed, there is no
    # report and no code for one to be about: on a pull request the scan runs
    # without it, because `sonarcloud` is required there, and on `main` it
    # skips, because an analysis of `main` without a report would set the
    # project's coverage to nothing. Where `tests` failed, this skips: the pull
    # request is already blocked on `tests and coverage`, and a scan without
    # coverage would read every new line as untested.
    needs: [scope, tests]
    if: ${{ !cancelled() && (needs.tests.result == 'success' || (needs.tests.result == 'skipped' && (github.event_name != 'push' || needs.scope.outputs.proved == 'true'))) && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar reads history to attribute an issue to the change that
          # introduced it, which is what makes "new code" a usable gate.
          fetch-depth: 0
          persist-credentials: false

      - name: The coverage and test report `tests` wrote
        if: needs.tests.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-report
          path: coverage

      # The same two reports, from the run that proved this tree. A proof is
      # only ever written with them, so one that is missing is a failure here
      # rather than a scan that reads every line as untested.
      - name: The coverage and test report that proved this tree
        if: needs.tests.result == 'skipped' && needs.scope.outputs.proved == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-proved
          key: ${{ env.PROVED_TREE }}-${{ needs.scope.outputs.tree }}
          fail-on-cache-miss: true
      - name: Where the scan reads the proof's report
        if: needs.tests.result == 'skipped' && needs.scope.outputs.proved == 'true'
        run: |
          mkdir -p coverage
          cp .ci-proved/coverage/clover.xml .ci-proved/coverage/junit.xml coverage/

      # A Dependabot run reads its secrets from the Dependabot store rather than
      # the Actions store, and `SONAR_TOKEN` lives only in the second. The
      # scanner was handed an empty string, died on "Not authorized or project
      # not found", and turned this job red over a step with nothing to do with
      # the bump. No dependency update in this repository has ever merged; #155
      # was the first one to try, and it sat on a stack trace about credentials
      # while the two action SHAs it carried were never in question.
      #
      # Skipped rather than left to fail: a scan that cannot authenticate has no
      # verdict to give, and a red tick meaning "the runner held no credential"
      # is worth less than a step that says so in a sentence. The coverage and
      # test report come from `tests and coverage`, which needs no token, so
      # what that check measures is unchanged on these pull requests.
      #
      # Keyed on who opened the pull request, because that is what selects the
      # secret store. Not `github.triggering_actor`, which becomes whoever
      # pressed re-run — keyed on that, this step would come back on the re-run
      # of a Dependabot pull request and fail it a second time.
      #
      # The event is named as well as the author. A push to main carries no pull
      # request, so the author field is null there, and what a null compares
      # equal to is not a rule this workflow should rest on: SonarCloud's
      # analysis of main is the baseline every pull request is measured against,
      # and a comparison that quietly went the other way would switch it off with
      # nothing anywhere to notice.
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        id: scan
        if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Runs when the scan failed, and asks the one question its output does not
      # answer: was that this repository or the host?
      #
      # A scanner that cannot reach SonarCloud fails with a Spring bean-creation
      # trace forty lines deep and `Error 503` somewhere in the middle, and the
      # required check beside it goes red exactly as it does for a real finding.
      # On 2026-09-13 SonarCloud answered 503 for over an hour and fourteen pull
      # requests across the organisation sat blocked behind a stack trace nobody
      # had read to the middle of.
      #
      # It reports and changes nothing: the scan still failed, the check is still
      # red, and `Q-R64` was still not enforced on this run. What it adds is the
      # sentence that says which of those two things happened.
      - name: Whether SonarCloud was answering
        if: always() && steps.scan.outcome == 'failure'
        run: |
          set -uo pipefail
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 \
            https://sonarcloud.io/api/system/status 2>/dev/null || echo "000")

          # 000 is curl reaching nothing at all, which is the same news as a 5xx
          # for the purpose of this sentence.
          case "$code" in
          5?? | 000)
            said="The scan failed and SonarCloud answered ${code} to a plain status request, so the host was unavailable rather than this pull request being at fault. Coverage and the test report come from the tests and coverage job, which this scan does not change. Re-run this job once sonarcloud.io is answering — nothing on this run enforced Q-R64."
            ;;
          *)
            said="The scan failed and SonarCloud answered ${code} to a plain status request, so the host was reachable and the failure is in this run rather than an outage. Read the scanner output above. Nothing on this run enforced Q-R64."
            ;;
          esac

          echo "::notice::${said}"
          printf '### Why the SonarCloud scan failed\n\n%s\n' "$said" >> "$GITHUB_STEP_SUMMARY"

      # Runs in exactly the case the scan does not. A step absent from a log
      # reads the same as a step that ran and found nothing, and this repository
      # has been caught by that reading before, so the skip appears under its own
      # name carrying its reason and the identifier it was decided on.
      - name: Why the scan was skipped
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          said="The SonarCloud scan was skipped: ${AUTHOR} opened this pull request, and a Dependabot run reads secrets from the Dependabot store rather than the Actions store, so SONAR_TOKEN is empty here and the scanner could only have failed on it. Coverage and the test report come from the tests and coverage job, which this scan does not change. No analysis was produced, so nothing on this run enforced Q-R64."
          echo "::notice::${said}"
          printf '### SonarCloud scan skipped\n\n%s\n' "$said" >> "$GITHUB_STEP_SUMMARY"

  # Q-R64 — the check this repository was the only one in the estate without.
  #
  # The scan above produces the analysis; nothing here read it. SonarCloud's free
  # plan cannot express "zero issues" as a quality gate condition, so a green
  # `SonarCloud Code Analysis` tick means the *quality gate* passed, not that the
  # project is clean — and this repository merged a pull request with two issues
  # standing open under exactly that tick. `php:S1186` on an empty constructor and
  # `php:S1142` on a method with four returns, both reported, both unread, because
  # no check in this repository ever asked for the number.
  #
  # Every other repository here calls the shared reusable in `spec`, which asks
  # both questions Q-R64 needs — new issues on this pull request, and open issues
  # against the project — and blocks on either. One definition, so a repository
  # cannot drift into gating differently from its neighbours, and so a fix to the
  # gate reaches all of them at once.
  gate:
    # No `name:`, deliberately. The required-check context is built from the job
    # ids — `gate / gate` — and every other repository here is protected under
    # exactly that string. A display name would rename the context and leave
    # this repository's branch protection pointing at a check that never
    # reports, which is the same hole this file exists to close.
    #
    # After the scan, so there is a summary to read. Without this the gate polls
    # for a comment the scan has not been started to produce yet and spends its
    # whole timeout waiting for one.
    needs: sonar
    # Ordering only, though. `needs` on its own also makes this job disappear
    # when the scan fails, and a required check that never reports blocks a pull
    # request with no line anywhere saying by what — the very hole the comment
    # above says this file exists to close, reopened from the other side. On
    # 2026-09-13 SonarCloud answered 503 for over an hour and every pull request
    # in the organisation sat on `MISSING: gate / gate`, while the job written to
    # explain exactly that was never scheduled to say it.
    #
    # Nothing is loosened by running it anyway: a failed scan leaves `sonar` red,
    # and `sonar` is a required check in its own right, so the pull request stays
    # blocked for the reason it should be. The gate then does what it always did
    # with no summary to read — warns, says Q-R64 went unenforced, and passes.
    #
    # `!cancelled()` rather than `always()`: a cancelled run is somebody pressing
    # stop, and finishing the job they stopped serves nobody.
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/sonar-gate.yml@ca6f4563337ae61c15af99c9b18436fd170781c1 # v1.0.51
    with:
      # Nothing, which is now true: `main` carries zero open issues, and the two
      # it did carry went out with the commit that installed this gate.
      #
      # This is what the previous value was for. `allowed-open` is a ceiling and
      # not a budget — the shared gate refuses any raise past the count actually
      # standing against the base branch — so a repository installs the gate at
      # whatever it inherited and walks it down. Two was the honest number for
      # one merge; zero is the honest number now, and from here the gate refuses
      # the first issue rather than the first issue past a tolerance.
      allowed-open: 0
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}

  # Records that every gate passed on this tree, so a later run on the same
  # tree — see `scope` — does not test it again. Only where the PHP gates
  # actually ran and nothing it waits on failed or was cancelled: a skipped PHP
  # gate proved nothing. A bridge gate is skipped where nothing it reads moved
  # against the base, so it passed here or had nothing to check.
  proved-tree:
    name: record the proven tree
    needs: [scope, guards, checks, typecheck, kotlin, swift, agreement, tests, sonar]
    if: ${{ !cancelled() && needs.scope.outputs.code == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          TREE: ${{ needs.scope.outputs.tree }}
        run: |
          mkdir -p .ci-proved
          printf '%s\n' "${TREE}" > .ci-proved/tree
      # The coverage and test report that proved the tree, kept with the proof
      # so a run that skips the suite on this tree hands SonarCloud the same.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-report
          path: .ci-proved/coverage
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-proved
          key: ${{ env.PROVED_TREE }}-${{ needs.scope.outputs.tree }}
