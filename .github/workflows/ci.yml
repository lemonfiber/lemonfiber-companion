name: ci

on:
  pull_request:
  # What a merge queue asks, and the only event it asks it on.
  #
  # A queued pull request is merged with `main`'s tip, and with everything ahead
  # of it in the queue, onto a temporary `gh-readonly-queue/main/...` branch;
  # this event is the queue asking for checks on that branch. Every context
  # `main` requires has to report on it. One that does not is not read as a
  # failure — it is read as a wait, and the pull request is dropped from the
  # queue when the status-check timeout expires, with nothing naming the cause.
  # That is the same hole `mutation-gate` and `sonar.yml`'s gate exist to close,
  # reached from a third direction.
  #
  # It carries no pull request. `github.event.pull_request` is null here, and
  # `github.head_ref` and `github.base_ref` are empty — so a job reading any of
  # them is handed nothing rather than an error, and a job that then *skips*
  # reports success, which is how a queue merges a batch nothing tested. Every
  # condition below that names an event says what it does on this one and why.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'
  # What lets `composer install` reach `plugins.nativephp.com`.
  #
  # `nativephp/mobile-local-notifications` is a paid first-party plugin served
  # from a private Composer repository, so an install without this credential
  # fails on the download with `402` rather than with anything that names the
  # cause. Set as an organisation secret so every repository in the estate that
  # needs a plugin can reach one without a second place to keep the value.
  #
  # A pull request from a fork is given no secrets, so this is empty there and
  # the install fails. That is the same limitation every paid dependency has and
  # is not something a workflow can route around; the scan job above already
  # skips forks for the same reason.
  COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

# Shaped for cost as much as for correctness.
#
# The obvious layout gives each gate its own job, and each job then pays for a
# checkout, a PHP install and a dependency install before doing about fifteen
# seconds of work. Eleven gates that way is eleven of those preambles, and the
# preamble is most of the bill.
#
# So the fast gates share one job and one install. The two slow ones stay
# separate because they need a coverage driver and genuinely take time — and
# mutation waits for the tests, because mutating code whose tests already fail
# tells you nothing and costs the most of anything here.
#
# Everything heavy runs on pull requests only. A push to `main` arrives through
# a pull request that already ran it; repeating the whole thing on the merge
# commit buys a second opinion on the same tree. `main` keeps the fast job as a
# net for anything that lands another way.

jobs:
  # Which of the following are worth running at all. A documentation change
  # should not start a PHP toolchain, and asking costs one checkout.
  scope:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          # What this branch is measured against, named per event rather than
          # inferred. A merge group's base is the tip the batch would land on,
          # so the diff below covers every pull request in the batch at once,
          # which is the whole point of a queue: one answer for the lot.
          #
          # Two fields rather than one because only one of them exists at a
          # time: `github.event.pull_request` is null on a merge group and
          # `github.event.merge_group` is null on a pull request. A single
          # expression reading either would fall through to the empty string on
          # the other, take the "no usable base commit" arm, and run every gate
          # — safe, and a sentence in the log that is not true.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # No base to compare against means run everything rather than guess.
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit, so every gate runs."
            exit 0
          fi
          changed="$(git diff --name-only "${BASE}" HEAD)"
          # Anything that is not documentation is treated as code. The list is
          # deliberately short: a new kind of file defaults to running the gates.
          if printf '%s\n' "${changed}" | grep -qvE '^(\.docs/|[^/]*\.md$|LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Documentation only; the PHP gates are skipped."
          fi

  # The gates every repository in the org shares, defined once in the spec repo
  # and pinned by commit. Those needing a pull request are guarded, because this
  # workflow also runs on pushes to main and on merge groups.
  #
  # `dco` and `attribution` are not guarded, and are the two that need no
  # `merge_group` handling at all: each reads a base..head range off the event,
  # finds none outside a pull request, and says `no PR range; skipping` in its
  # own log before passing. That is a reported pass rather than a silent one,
  # which is the whole reason they are shaped that way.
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@719d8380ff919dccc74d056cd4e1b32153ca08a0 # v1.0.14

  # Beside `dco` because the two read the same record from opposite directions:
  # that one insists a human attested to the work, this one insists no tool is
  # credited for it (`GOV-R46`). Unguarded for `dco`'s reason — it is shaped the
  # same way and says "no PR range; skipping" on a push to main rather than
  # needing an `if` here to say it for it.
  attribution:
    uses: lemonfiber/spec/.github/workflows/attribution.yml@719d8380ff919dccc74d056cd4e1b32153ca08a0 # v1.0.14

  # `pull-requests: write` is what lets the gate close a pull request whose
  # citation is missing or names an identifier that does not exist, rather than
  # only going red at it. The workflow-level `contents: read` above is the
  # default for a job that declares nothing; a job-level block replaces that
  # default outright, so `contents: read` is restated here rather than inherited.
  spec-check:
    # A merge group runs this, for `commitlint`'s naming reason: the required
    # context is the caller job and the called job joined, and a caller that
    # skips leaves no tick at all rather than a skipped one — which a queue
    # reads as a wait and ends by dropping the pull request.
    #
    # It could not be run until the pin above moved. The shared gate read its
    # range from `github.event.pull_request` alone, took two empty strings on a
    # merge group and exited 1 — failing a whole batch over a pull request that
    # was never in the event, which is the other way this context could have
    # locked the queue. It now names the range per event.
    #
    # What it asks of a merge group is narrower, and its run says so rather than
    # leaving a bare tick. `GOV-R3` is asked: every identifier the batch cites is
    # resolved against spec@main as it stands now, which is the one answer that
    # can change while a pull request waits in a queue. `GOV-R2` is not re-asked:
    # a citation may live in the pull request body and Dependabot's allowance
    # keys on the author, and a merge group carries neither — so demanding a
    # trailer of the commits alone would refuse a batch for citing exactly where
    # the rule allows it. Presence was settled before the queue accepted the
    # pull request, and a merge group does not rewrite a commit message. Nothing
    # is closed there: the batch is the queue's rather than any one author's.
    #
    # `push` stays out: `main` does not require this context.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@719d8380ff919dccc74d056cd4e1b32153ca08a0 # v1.0.14

  commitlint:
    # A merge group runs this, and not because there is anything to lint there:
    # the shared gate finds no range, says `no PR range; skipping`, and passes.
    # It runs because of how a skipped job is *named*. `commitlint / commitlint`
    # is the caller job and the called job joined, and skipping the caller means
    # the called job never exists — so that name reports nothing at all rather
    # than reporting a skip, and a required context that reports nothing is a
    # wait the queue ends by dropping the pull request. `spec-check` above is
    # the same shape and is why this one is spelled out only once.
    #
    # `push` stays out: `main` does not require this context, so no name is
    # waiting to be reported there and the runner would be spent for nothing.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@719d8380ff919dccc74d056cd4e1b32153ca08a0 # v1.0.14

  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@719d8380ff919dccc74d056cd4e1b32153ca08a0 # v1.0.14

  # Every pin this repository holds on a shared workflow, against what the
  # spec's default branch holds now. It fails naming the commits a pin has not
  # taken; a run that could not ask which they are says so rather than reporting
  # clean.
  #
  # `hygiene` above asks a different question and passing it is not this passing:
  # that one reads the workflows as files, and this one measures each pin against
  # the history of the file it names. Without it a pin rots with nothing to say
  # so, which is how the `sonar-gate` pin came to be a commit behind and stayed
  # there until another repository's gate found it.
  #
  # **Reporting here, not gating, and that is a deferral rather than an
  # oversight.** `Q-R68` asks for this to be a required check on the default
  # branch and it is not one here. `Q-R71` is the form that admission takes, so
  # it is taken in full:
  #
  # - *The reason.* The remedy for a red run is a pin bump, and nothing opens
  #   one in lockstep across the org. Made required before that exists, the gate
  #   blocks its own cure: the bump is itself a pull request, and it arrives at a
  #   default branch where every pull request is already red for wanting it.
  # - *The work it waits on.* `OPS-R48` — the automated pull request that bumps
  #   every consumer when these workflows move. Dependabot covers part of it
  #   here, daily and with `lemonfiber/spec*` claimed ahead of the wildcard, but
  #   it proposes whatever tag existed when it ran, so a proposal can land
  #   already behind a tag published after it was computed. That is the gap, and
  #   it is not one a schedule closes.
  # - *When it is reviewed.* 2026-12-22, or the day `OPS-R48` lands, whichever
  #   comes first.
  #
  # On 2026-09-22 the argument stopped being hypothetical: a tag moved one line
  # of `scorecard.yml` and nine of the ten repositories that pin it went red at
  # once. The nine that require this check could merge nothing until each was
  # bumped by hand. This repository could still merge, which is the whole of what
  # the deferral buys and the whole of why it is written down rather than left to
  # look like a repository nobody finished configuring.
  workflow-pins:
    uses: lemonfiber/spec/.github/workflows/workflow-pins.yml@719d8380ff919dccc74d056cd4e1b32153ca08a0 # v1.0.14

  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@719d8380ff919dccc74d056cd4e1b32153ca08a0 # v1.0.14

  labeler:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@719d8380ff919dccc74d056cd4e1b32153ca08a0 # v1.0.14

  # The rules, before anything slower gets a chance to hide a boundary break.
  #
  # Arch and Templates read files and need neither a coverage driver nor a
  # database, so this is the cheapest job here and the one most likely to fail on
  # a change that is wrong rather than merely broken. Failing it first means a
  # reviewer sees "this crosses a module boundary" rather than a coverage number.
  rules:
    name: rules
    needs: scope
    # `scope` deciding "no code changed" is a skip, and the gates are scoped so
    # that a documentation change does not start a PHP toolchain. `scope`
    # *failing* produces the same skip — a checkout that broke or a runner that
    # died leaves no output, and no output is not a "no".
    #
    # Either way that is wrong. If a skipped required check satisfies branch
    # protection, a pull request merges with none of these run and nothing red.
    # If it does not, the check never reports and the pull request is blocked
    # forever with nothing anywhere naming the cause. The job's own comments say
    # which way it means to fail — "No usable base commit, so every gate runs",
    # "a new kind of file defaults to running the gates" — and its own failure
    # was the one path that did the opposite.
    #
    # So the condition asks the result as well as the output.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: vendor/bin/pest --testsuite=Arch,Templates

  # R2 — every rule refuses a planted violation.
  #
  # Its own job because it runs the analyser and the test suite as subprocesses,
  # once each, which is a full framework boot twice over. It is also the one job
  # that writes files into the working tree, so it must not share a runner with
  # anything that would read them.
  guards:
    name: the rules refuse violations
    needs: scope
    # `scope` deciding "no code changed" is a skip, and the gates are scoped so
    # that a documentation change does not start a PHP toolchain. `scope`
    # *failing* produces the same skip — a checkout that broke or a runner that
    # died leaves no output, and no output is not a "no".
    #
    # Either way that is wrong. If a skipped required check satisfies branch
    # protection, a pull request merges with none of these run and nothing red.
    # If it does not, the check never reports and the pull request is blocked
    # forever with nothing anywhere naming the cause. The job's own comments say
    # which way it means to fail — "No usable base commit, so every gate runs",
    # "a new kind of file defaults to running the gates" — and its own failure
    # was the one path that did the opposite.
    #
    # So the condition asks the result as well as the output.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer test:guards

  # Formatting, static analysis, dead idioms, the repository's own guards and
  # dependency hygiene. One install, one PHP, six commands, no coverage driver.
  checks:
    name: checks
    needs: scope
    # `scope` deciding "no code changed" is a skip, and the gates are scoped so
    # that a documentation change does not start a PHP toolchain. `scope`
    # *failing* produces the same skip — a checkout that broke or a runner that
    # died leaves no output, and no output is not a "no".
    #
    # Either way that is wrong. If a skipped required check satisfies branch
    # protection, a pull request merges with none of these run and nothing red.
    # If it does not, the check never reports and the pull request is blocked
    # forever with nothing anywhere naming the cause. The job's own comments say
    # which way it means to fail — "No usable base commit, so every gate runs",
    # "a new kind of file defaults to running the gates" — and its own failure
    # was the one path that did the opposite.
    #
    # So the condition asks the result as well as the output.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .phpstan-cache
            .rector-cache
          key: analysis-${{ runner.os }}-${{ github.sha }}
          restore-keys: analysis-${{ runner.os }}-
      # Cheapest first, so a misplaced brace fails in seconds rather than after
      # the analyser has walked the tree.
      - run: composer validate --strict
      - run: composer validate:modules
      - run: composer normalize --dry-run
      - run: composer normalize:modules
      - run: composer lint
      - run: composer analyse
      - run: composer refactor
      - run: composer deps
      - run: composer audit

  tests:
    name: tests and coverage
    needs: scope
    # `scope` deciding "no code changed" is a skip, and the gates are scoped so
    # that a documentation change does not start a PHP toolchain. `scope`
    # *failing* produces the same skip — a checkout that broke or a runner that
    # died leaves no output, and no output is not a "no".
    #
    # Either way that is wrong. If a skipped required check satisfies branch
    # protection, a pull request merges with none of these run and nothing red.
    # If it does not, the check never reports and the pull request is blocked
    # forever with nothing anywhere naming the cause. The job's own comments say
    # which way it means to fail — "No usable base commit, so every gate runs",
    # "a new kind of file defaults to running the gates" — and its own failure
    # was the one path that did the opposite.
    #
    # So the condition asks the result as well as the output.
    #
    # A merge group runs this exactly as a pull request does, and that is the
    # single most important line in this file. Left as `pull_request` alone this
    # job skips in the queue, a skipped required check reports success, and the
    # queue merges a batch the suite was never run over — the whole tree of
    # comments above, undone by the one event that has the last word.
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # Writes the clover report the floors gate reads. One run produces both
      # the global number and the fifteen per-tree ones.
      - run: composer test:report
      - run: composer test:floors

  # Which trees are worth mutating, asked of the same script that mutates
  # them. A list written here would be a second source of truth that goes stale
  # the day a tree gains its first class — silently, because the run still
  # passes, over less.
  #
  # The dependencies are installed for one `--list`, which reads as waste and
  # is not. The script derives the trees from `phpunit.xml` through
  # `Tests\Support\MeasuredTree`, which is the same derivation the `Floors`
  # suite and `G7` read — and the only way a script reaches it is the
  # autoloader. The alternative is a second copy of "what is measured" written
  # out here in a file nothing compares against the first.
  mutation-scope:
    name: what to mutate
    needs: tests
    if: ${{ !cancelled() && needs.tests.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      trees: ${{ steps.list.outputs.trees }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - id: list
        run: echo "trees=$(php scripts/mutation.php --list)" >> "$GITHUB_OUTPUT"

  # The most expensive gate in the repository, so it is the most guarded: only
  # on a pull request, only once the tests have passed, and only over the app's
  # own logic. Mutating code whose tests are already failing measures nothing.
  #
  # A runner per measured tree, because this is the one gate whose work
  # genuinely separates: a floor of 100 admits no offsetting between trees, so
  # each is already judged alone and running them in one process only made the
  # wall clock the sum of them. It was several minutes and the longest thing in
  # the repository; now it is the slowest single tree.
  #
  # `fail-fast: false` because the point of a shard is to learn about all of
  # them: cancelling nine runners over one escaped mutant means a second push
  # to find the next one.
  mutation:
    name: mutation
    needs: [tests, mutation-scope]
    if: ${{ !cancelled() && needs.mutation-scope.result == 'success' && needs.mutation-scope.outputs.trees != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        tree: ${{ fromJson(needs.mutation-scope.outputs.trees) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer test:mutation -- --tree=${{ matrix.tree }}

  # The check branch protection actually names.
  #
  # A matrix job reports one check per entry — `mutation (bridge/src)`,
  # `mutation (app-modules/kernel/src)` — and none of them is called
  # `mutation testing`. That
  # required check would simply never report, and a required check that never
  # reports blocks a pull request forever with nothing anywhere naming the
  # cause. It is the same hole `sonar.yml`'s gate exists to close, and it is
  # reached here by renaming rather than by a failure.
  #
  # So this job keeps the name and answers for the shards. `!cancelled()` rather
  # than `always()`: a cancelled run is somebody pressing stop.
  #
  # It asks the results rather than depending on them, for the reason every
  # other gate in this file does: `needs` alone makes a job disappear when what
  # it needs fails, which turns a red gate into a missing one.
  mutation-gate:
    name: mutation testing
    # `scope` is needed for its outputs rather than its work: this job has to
    # be able to tell a `tests` that skipped by design from one that skipped
    # because something upstream broke, and those two are indistinguishable
    # from `needs.tests.result` alone.
    needs: [scope, tests, mutation-scope, mutation]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: every tree that was mutated passed
        env:
          TESTS: ${{ needs.tests.result }}
          SCOPE: ${{ needs.mutation-scope.result }}
          SHARDS: ${{ needs.mutation.result }}
          EVENT: ${{ github.event_name }}
          SCOPED: ${{ needs.scope.result }}
          CHANGED: ${{ needs.scope.outputs.code }}
        run: |
          # `skipped` is a pass here and only here: the shards are skipped when
          # no measured tree holds code yet, which `mutation-scope` reports as an empty
          # list. Every other reason a shard does not run — a failure upstream,
          # a cancelled run — is already covered by the two results above it.
          echo "tests=$TESTS scope=$SCOPE shards=$SHARDS event=$EVENT scoped=$SCOPED changed=$CHANGED"

          # `merge_group` is named beside `pull_request` below because `tests`
          # now runs on both. Left out, a merge group whose tests skipped for
          # any reason at all would read as "not a pull request, so nothing was
          # meant to run" — and the queue is the event where that sentence is
          # least true, being the last thing between the batch and `main`.
          #
          # `tests` runs on a pull request or a merge group that touched code,
          # and skips otherwise. Both of those skips are deliberate and this job
          # is downstream of them, so without this it fails on every push to the
          # default branch — main is then permanently red for a reason that has
          # nothing to do with the commit — and a documentation-only pull
          # request cannot merge at all, because this is a required context and
          # a required context that fails blocks rather than skips.
          #
          # That is the failure `tests`' own comment was written to prevent,
          # reintroduced one job downstream of it.
          #
          # The condition is restated rather than inferred. `needs.tests.result`
          # says `skipped` whether the skip was intended or whether something
          # above it broke, and treating those alike is what would let a real
          # breakage pass as a quiet day. So this asks the same two questions
          # `tests` asks, of the same inputs, and calls only those two skips a
          # pass.
          BY_DESIGN=no

          if [ "$TESTS" = skipped ]; then
            if [ "$EVENT" != pull_request ] && [ "$EVENT" != merge_group ]; then
              BY_DESIGN=yes
            elif [ "$SCOPED" = success ] && [ "$CHANGED" != true ]; then
              BY_DESIGN=yes
            fi
          fi

          if [ "$BY_DESIGN" = yes ]; then
            echo "Nothing to mutate: the tests did not run, and were not meant to."
            exit 0
          fi

          if [ "$TESTS" != success ] || [ "$SCOPE" != success ]; then
            echo "::error::Mutation did not run: the tests or the tree list did not pass."
            exit 1
          fi

          if [ "$SHARDS" != success ] && [ "$SHARDS" != skipped ]; then
            echo "::error::A tree's mutation run did not pass. Open the mutation (<tree>) job that is red."
            exit 1
          fi
