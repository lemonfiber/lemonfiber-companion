name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'
  # What lets `composer install` reach `plugins.nativephp.com`.
  #
  # `nativephp/mobile-local-notifications` is a paid first-party plugin served
  # from a private Composer repository, so an install without this credential
  # fails on the download with `402` rather than with anything that names the
  # cause. Set as an organisation secret so every repository in the estate that
  # needs a plugin can reach one without a second place to keep the value.
  #
  # A pull request from a fork is given no secrets, so this is empty there and
  # the install fails. That is the same limitation every paid dependency has and
  # is not something a workflow can route around; the scan job above already
  # skips forks for the same reason.
  COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

# Shaped for cost as much as for correctness.
#
# The obvious layout gives each gate its own job, and each job then pays for a
# checkout, a PHP install and a dependency install before doing about fifteen
# seconds of work. Eleven gates that way is eleven of those preambles, and the
# preamble is most of the bill.
#
# So the fast gates share one job and one install. The two slow ones stay
# separate because they need a coverage driver and genuinely take time — and
# mutation waits for the tests, because mutating code whose tests already fail
# tells you nothing and costs the most of anything here.
#
# Everything heavy runs on pull requests only. A push to `main` arrives through
# a pull request that already ran it; repeating the whole thing on the merge
# commit buys a second opinion on the same tree. `main` keeps the fast job as a
# net for anything that lands another way.

jobs:
  # Which of the following are worth running at all. A documentation change
  # should not start a PHP toolchain, and asking costs one checkout.
  scope:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          # No base to compare against means run everything rather than guess.
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit, so every gate runs."
            exit 0
          fi
          changed="$(git diff --name-only "${BASE}" HEAD)"
          # Anything that is not documentation is treated as code. The list is
          # deliberately short: a new kind of file defaults to running the gates.
          if printf '%s\n' "${changed}" | grep -qvE '^(\.docs/|[^/]*\.md$|LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Documentation only; the PHP gates are skipped."
          fi

  # The gates every repository in the org shares, defined once in the spec repo
  # and pinned by commit. Those needing a pull request are guarded, because this
  # workflow also runs on pushes to main.
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@a269e7f347ed92988cbf03394130b6fee93347da # main

  # `pull-requests: write` is what lets the gate close a pull request whose
  # citation is missing or names an identifier that does not exist, rather than
  # only going red at it. The workflow-level `contents: read` above is the
  # default for a job that declares nothing; a job-level block replaces that
  # default outright, so `contents: read` is restated here rather than inherited.
  spec-check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@a269e7f347ed92988cbf03394130b6fee93347da # main

  commitlint:
    if: github.event_name == 'pull_request'
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@a269e7f347ed92988cbf03394130b6fee93347da # main

  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@a269e7f347ed92988cbf03394130b6fee93347da # main

  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@a269e7f347ed92988cbf03394130b6fee93347da # main

  labeler:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@a269e7f347ed92988cbf03394130b6fee93347da # main

  # The rules, before anything slower gets a chance to hide a boundary break.
  #
  # Arch and Templates read files and need neither a coverage driver nor a
  # database, so this is the cheapest job here and the one most likely to fail on
  # a change that is wrong rather than merely broken. Failing it first means a
  # reviewer sees "this crosses a module boundary" rather than a coverage number.
  rules:
    name: rules
    needs: scope
    # `scope` deciding "no code changed" is a skip, and the gates are scoped so
    # that a documentation change does not start a PHP toolchain. `scope`
    # *failing* produces the same skip — a checkout that broke or a runner that
    # died leaves no output, and no output is not a "no".
    #
    # Either way that is wrong. If a skipped required check satisfies branch
    # protection, a pull request merges with none of these run and nothing red.
    # If it does not, the check never reports and the pull request is blocked
    # forever with nothing anywhere naming the cause. The job's own comments say
    # which way it means to fail — "No usable base commit, so every gate runs",
    # "a new kind of file defaults to running the gates" — and its own failure
    # was the one path that did the opposite.
    #
    # So the condition asks the result as well as the output.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: vendor/bin/pest --testsuite=Arch,Templates

  # R2 — every rule refuses a planted violation.
  #
  # Its own job because it runs the analyser and the test suite as subprocesses,
  # once each, which is a full framework boot twice over. It is also the one job
  # that writes files into the working tree, so it must not share a runner with
  # anything that would read them.
  guards:
    name: the rules refuse violations
    needs: scope
    # `scope` deciding "no code changed" is a skip, and the gates are scoped so
    # that a documentation change does not start a PHP toolchain. `scope`
    # *failing* produces the same skip — a checkout that broke or a runner that
    # died leaves no output, and no output is not a "no".
    #
    # Either way that is wrong. If a skipped required check satisfies branch
    # protection, a pull request merges with none of these run and nothing red.
    # If it does not, the check never reports and the pull request is blocked
    # forever with nothing anywhere naming the cause. The job's own comments say
    # which way it means to fail — "No usable base commit, so every gate runs",
    # "a new kind of file defaults to running the gates" — and its own failure
    # was the one path that did the opposite.
    #
    # So the condition asks the result as well as the output.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer test:guards

  # Formatting, static analysis, dead idioms, the repository's own guards and
  # dependency hygiene. One install, one PHP, six commands, no coverage driver.
  checks:
    name: checks
    needs: scope
    # `scope` deciding "no code changed" is a skip, and the gates are scoped so
    # that a documentation change does not start a PHP toolchain. `scope`
    # *failing* produces the same skip — a checkout that broke or a runner that
    # died leaves no output, and no output is not a "no".
    #
    # Either way that is wrong. If a skipped required check satisfies branch
    # protection, a pull request merges with none of these run and nothing red.
    # If it does not, the check never reports and the pull request is blocked
    # forever with nothing anywhere naming the cause. The job's own comments say
    # which way it means to fail — "No usable base commit, so every gate runs",
    # "a new kind of file defaults to running the gates" — and its own failure
    # was the one path that did the opposite.
    #
    # So the condition asks the result as well as the output.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .phpstan-cache
            .rector-cache
          key: analysis-${{ runner.os }}-${{ github.sha }}
          restore-keys: analysis-${{ runner.os }}-
      # Cheapest first, so a misplaced brace fails in seconds rather than after
      # the analyser has walked the tree.
      - run: composer validate --strict
      - run: composer validate:modules
      - run: composer normalize --dry-run
      - run: composer normalize:modules
      - run: composer lint
      - run: composer analyse
      - run: composer refactor
      - run: composer deps
      - run: composer audit

  tests:
    name: tests and coverage
    needs: scope
    # `scope` deciding "no code changed" is a skip, and the gates are scoped so
    # that a documentation change does not start a PHP toolchain. `scope`
    # *failing* produces the same skip — a checkout that broke or a runner that
    # died leaves no output, and no output is not a "no".
    #
    # Either way that is wrong. If a skipped required check satisfies branch
    # protection, a pull request merges with none of these run and nothing red.
    # If it does not, the check never reports and the pull request is blocked
    # forever with nothing anywhere naming the cause. The job's own comments say
    # which way it means to fail — "No usable base commit, so every gate runs",
    # "a new kind of file defaults to running the gates" — and its own failure
    # was the one path that did the opposite.
    #
    # So the condition asks the result as well as the output.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # Writes the clover report the floors gate reads. One run produces both
      # the global number and the twelve per-module ones.
      - run: composer test:report
      - run: composer test:floors

  # Which modules are worth mutating, asked of the same script that mutates
  # them. A list written here would be a second source of truth that goes stale
  # the day a module gains its first class — silently, because the run still
  # passes, over less.
  mutation-scope:
    name: what to mutate
    needs: tests
    if: ${{ !cancelled() && needs.tests.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
      - id: list
        run: echo "modules=$(php scripts/mutation.php --list)" >> "$GITHUB_OUTPUT"

  # The most expensive gate in the repository, so it is the most guarded: only
  # on a pull request, only once the tests have passed, and only over the app's
  # own logic. Mutating code whose tests are already failing measures nothing.
  #
  # A runner per module, because this is the one gate whose work genuinely
  # separates: a floor of 100 admits no offsetting between modules, so each is
  # already judged alone and running them in one process only made the wall
  # clock the sum of them. It was several minutes and the longest thing in the
  # repository; now it is the slowest single module.
  #
  # `fail-fast: false` because the point of a shard is to learn about all of
  # them: cancelling eleven runners over one escaped mutant means a second push
  # to find the next one.
  mutation:
    name: mutation
    needs: [tests, mutation-scope]
    if: ${{ !cancelled() && needs.mutation-scope.result == 'success' && needs.mutation-scope.outputs.modules != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.mutation-scope.outputs.modules) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer test:mutation -- --module=${{ matrix.module }}

  # The check branch protection actually names.
  #
  # A matrix job reports one check per entry — `mutation (kernel)`,
  # `mutation (operator)` — and none of them is called `mutation testing`. That
  # required check would simply never report, and a required check that never
  # reports blocks a pull request forever with nothing anywhere naming the
  # cause. It is the same hole `sonar.yml`'s gate exists to close, and it is
  # reached here by renaming rather than by a failure.
  #
  # So this job keeps the name and answers for the shards. `!cancelled()` rather
  # than `always()`: a cancelled run is somebody pressing stop.
  #
  # It asks the results rather than depending on them, for the reason every
  # other gate in this file does: `needs` alone makes a job disappear when what
  # it needs fails, which turns a red gate into a missing one.
  mutation-gate:
    name: mutation testing
    needs: [tests, mutation-scope, mutation]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: every module that was mutated passed
        env:
          TESTS: ${{ needs.tests.result }}
          SCOPE: ${{ needs.mutation-scope.result }}
          SHARDS: ${{ needs.mutation.result }}
        run: |
          # `skipped` is a pass here and only here: the shards are skipped when
          # no module holds code yet, which `mutation-scope` reports as an empty
          # list. Every other reason a shard does not run — a failure upstream,
          # a cancelled run — is already covered by the two results above it.
          echo "tests=$TESTS scope=$SCOPE shards=$SHARDS"

          if [ "$TESTS" != success ] || [ "$SCOPE" != success ]; then
            echo "::error::Mutation did not run: the tests or the module list did not pass."
            exit 1
          fi

          if [ "$SHARDS" != success ] && [ "$SHARDS" != skipped ]; then
            echo "::error::A module's mutation run did not pass. Open the mutation (<module>) job that is red."
            exit 1
          fi
