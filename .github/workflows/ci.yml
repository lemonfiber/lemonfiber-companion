name: ci

on:
  pull_request:
  # What a merge queue asks, and the only event it asks it on.
  #
  # A queued pull request is merged with `main`'s tip, and with everything ahead
  # of it in the queue, onto a temporary `gh-readonly-queue/main/...` branch;
  # this event is the queue asking for checks on that branch. Every context
  # `main` requires has to report on it. One that does not is not read as a
  # failure — it is read as a wait, and the pull request is dropped from the
  # queue when the status-check timeout expires, with nothing naming the cause.
  # That is the same hole `mutation-gate` and the SonarCloud `gate` exist to
  # close, reached from a third direction.
  #
  # It carries no pull request. `github.event.pull_request` is null here, and
  # `github.head_ref` and `github.base_ref` are empty — so a job reading any of
  # them is handed nothing rather than an error, and a job that then *skips*
  # reports success, which is how a queue merges a batch nothing tested. Every
  # condition below that names an event says what it does on this one and why.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'
  # What lets `composer install` reach `plugins.nativephp.com`.
  #
  # `nativephp/mobile-local-notifications` is a paid first-party plugin served
  # from a private Composer repository, so an install without this credential
  # fails on the download with `402` rather than with anything that names the
  # cause. Set as an organisation secret so every repository in the estate that
  # needs a plugin can reach one without a second place to keep the value.
  #
  # A pull request from a fork is given no secrets, so this is empty there and
  # the install fails. That is the same limitation every paid dependency has and
  # is not something a workflow can route around; the scan job above already
  # skips forks for the same reason.
  COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

# Shaped for cost as much as for correctness.
#
# The obvious layout gives each gate its own job, and each job then pays for a
# checkout, a PHP install and a dependency install before doing about fifteen
# seconds of work. Eleven gates that way is eleven of those preambles, and the
# preamble is most of the bill.
#
# So the fast gates share one job and one install. The two slow ones stay
# separate because they need a coverage driver and genuinely take time — and
# mutation waits for the tests, because mutating code whose tests already fail
# tells you nothing and costs the most of anything here.
#
# A pull request mutates what its change reaches, and `main` mutates what was
# reached since its last commit that passed. `scripts/mutation.php
# --changed-since` says what a change reaches: a changed source file, the
# module a changed module test belongs to, and every file a changed test
# executes, read from the coverage map `tests` wrote — so a test edited to
# assert less has the code it judged mutated against it again. A change to
# how the gate runs — a manifest, `phpunit.xml`, `tests/Support`, this file —
# and a deleted test mutate everything.

jobs:
  # Which of the following are worth running at all. A documentation change
  # should not start a PHP toolchain, and asking costs one checkout.
  scope:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.proved.outputs.cache-hit == 'true' && 'false' || steps.diff.outputs.code }}
      tree: ${{ steps.tree.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The tree these gates would test. On a pull request that is the branch
      # merged onto its base, so a rebase that leaves the result byte for byte
      # as it was — a stacked branch whose base was squash-merged, a base that
      # moved only where the branch already agreed — names the same tree. A
      # tree every PHP gate already passed on is not tested again: the gates
      # take the path a documentation change takes, and `mutation testing`
      # and the SonarCloud gate read that as a pass. The proof is recorded by
      # `proved-tree` below, only once every gate passed on it, and a branch
      # can read its own proofs and `main`'s, never another branch's.
      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - id: proved
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-proved
          key: ci-proved-tree-${{ steps.tree.outputs.tree }}
          lookup-only: true
      - if: steps.proved.outputs.cache-hit == 'true'
        env:
          TREE: ${{ steps.tree.outputs.tree }}
        run: |
          echo "Every PHP gate already passed on tree ${TREE}; they are not run again." | tee -a "$GITHUB_STEP_SUMMARY"
      - id: diff
        if: steps.proved.outputs.cache-hit != 'true'
        env:
          # What this branch is measured against, named per event rather than
          # inferred. A merge group's base is the tip the batch would land on,
          # so the diff below covers every pull request in the batch at once,
          # which is the whole point of a queue: one answer for the lot.
          #
          # One field per event because only one of them exists at a time:
          # `github.event.pull_request` is null on a merge group and on a push,
          # and `github.event.merge_group` is null on the other two. A single
          # expression reading one would fall through to the empty string on
          # the others, take the "no usable base commit" arm, and run every
          # gate — safe, and a sentence in the log that is not true.
          #
          # A push to `main` is measured against the commit before it, so a
          # push of documentation alone starts no PHP gate there either.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          # No base to compare against means run everything rather than guess.
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit, so every gate runs."
            exit 0
          fi
          changed="$(git diff --name-only "${BASE}" HEAD)"
          # Anything that is not documentation is treated as code. The list is
          # deliberately short: a new kind of file defaults to running the gates.
          # A Markdown file is documentation wherever it sits, a module's
          # README as much as the root's; the one suite that reads Markdown is
          # Arch, and `rules` runs it on every change.
          #
          # Under `.github/`, only this file runs the PHP gates, so a change to
          # any other file there starts none of them. A change to this file
          # starts none of them either where every line it changes is a pin
          # on a shared workflow from `lemonfiber/spec`: those jobs run no PHP.
          code=false
          while IFS= read -r path; do
            case "${path}" in
            '' | .docs/* | *.md | LICENSE) continue ;;
            .github/workflows/ci.yml)
              if git diff -U0 "${BASE}" HEAD -- "${path}" \
                | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' \
                | grep -qvE '^[-+][[:space:]]*uses: lemonfiber/spec/\.github/workflows/[^@]+@[0-9a-f]{40}( # .*)?$'; then
                code=true
              fi
              ;;
            .github/*) continue ;;
            *) code=true ;;
            esac
          done <<< "${changed}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" = false ]; then
            echo "Documentation, and workflows that run no PHP gate; the PHP gates are skipped."
          fi

  # The gates every repository in the org shares, defined once in the spec repo
  # and pinned by commit. Those needing a pull request are guarded, because this
  # workflow also runs on pushes to main and on merge groups.
  #
  # `dco` and `attribution` are not guarded, and need no `merge_group`
  # handling here: each reads the range it checks off the event — a pull
  # request's base..head, or a merge group's — and fails where a pull request
  # or a merge group gives none. On a push to `main` there is no range, and each
  # says `no PR range; skipping` in its own log before passing: a reported pass
  # rather than a silent one.
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@60d130a3d799e4826111f9eeffa932b733bc22c3 # v1.0.16

  # Beside `dco` because the two read the same record from opposite directions:
  # that one insists a human attested to the work, this one insists no tool is
  # credited for it (`GOV-R46`). Unguarded for `dco`'s reason — it is shaped the
  # same way: it checks a pull request's or a merge group's range, and says
  # "no PR range; skipping" on a push to main.
  attribution:
    uses: lemonfiber/spec/.github/workflows/attribution.yml@60d130a3d799e4826111f9eeffa932b733bc22c3 # v1.0.16

  # `pull-requests: write` is what lets the gate close a pull request whose
  # citation is missing or names an identifier that does not exist, rather than
  # only going red at it. The workflow-level `contents: read` above is the
  # default for a job that declares nothing; a job-level block replaces that
  # default outright, so `contents: read` is restated here rather than inherited.
  spec-check:
    # A merge group runs this, for `commitlint`'s naming reason: the required
    # context is the caller job and the called job joined, and a caller that
    # skips leaves no tick at all rather than a skipped one — which a queue
    # reads as a wait and ends by dropping the pull request.
    #
    # It could not be run until the pin above moved. The shared gate read its
    # range from `github.event.pull_request` alone, took two empty strings on a
    # merge group and exited 1 — failing a whole batch over a pull request that
    # was never in the event, which is the other way this context could have
    # locked the queue. It now names the range per event.
    #
    # What it asks of a merge group is narrower, and its run says so rather than
    # leaving a bare tick. `GOV-R3` is asked: every identifier the batch cites is
    # resolved against spec@main as it stands now, which is the one answer that
    # can change while a pull request waits in a queue. `GOV-R2` is not re-asked:
    # a citation may live in the pull request body and Dependabot's allowance
    # keys on the author, and a merge group carries neither — so demanding a
    # trailer of the commits alone would refuse a batch for citing exactly where
    # the rule allows it. Presence was settled before the queue accepted the
    # pull request, and a merge group does not rewrite a commit message. Nothing
    # is closed there: the batch is the queue's rather than any one author's.
    #
    # `push` stays out: `main` does not require this context.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@60d130a3d799e4826111f9eeffa932b733bc22c3 # v1.0.16

  commitlint:
    # A merge group runs this, and the shared gate lints the group's own
    # base..head range, so every subject the queue is about to merge is read.
    # It has to run for a second reason too, which is how a skipped job is
    # *named*. `commitlint / commitlint`
    # is the caller job and the called job joined, and skipping the caller means
    # the called job never exists — so that name reports nothing at all rather
    # than reporting a skip, and a required context that reports nothing is a
    # wait the queue ends by dropping the pull request. `spec-check` above is
    # the same shape and is why this one is spelled out only once.
    #
    # `push` stays out: `main` does not require this context, so no name is
    # waiting to be reported there and the runner would be spent for nothing.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@60d130a3d799e4826111f9eeffa932b733bc22c3 # v1.0.16

  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@60d130a3d799e4826111f9eeffa932b733bc22c3 # v1.0.16

  # Every pin this repository holds on a shared workflow, against what the
  # spec's default branch holds now. It fails naming the commits a pin has not
  # taken; a run that could not ask which they are says so rather than reporting
  # clean.
  #
  # `hygiene` above asks a different question and passing it is not this passing:
  # that one reads the workflows as files, and this one measures each pin against
  # the history of the file it names. Without it a pin rots with nothing to say
  # so, which is how the `sonar-gate` pin came to be a commit behind and stayed
  # there until another repository's gate found it.
  #
  # **Reporting here, not gating, and that is a deferral rather than an
  # oversight.** `Q-R68` asks for this to be a required check on the default
  # branch and it is not one here. `Q-R71` is the form that admission takes, so
  # it is taken in full:
  #
  # - *The reason.* The remedy for a red run is a pin bump, and nothing opens
  #   one in lockstep across the org. Made required before that exists, the gate
  #   blocks its own cure: the bump is itself a pull request, and it arrives at a
  #   default branch where every pull request is already red for wanting it.
  # - *The work it waits on.* `OPS-R48` — the automated pull request that bumps
  #   every consumer when these workflows move. Dependabot covers part of it
  #   here, daily and with `lemonfiber/spec*` claimed ahead of the wildcard, but
  #   it proposes whatever tag existed when it ran, so a proposal can land
  #   already behind a tag published after it was computed. That is the gap, and
  #   it is not one a schedule closes.
  # - *When it is reviewed.* 2026-12-22, or the day `OPS-R48` lands, whichever
  #   comes first.
  #
  # On 2026-09-22 the argument stopped being hypothetical: a tag moved one line
  # of `scorecard.yml` and nine of the ten repositories that pin it went red at
  # once. The nine that require this check could merge nothing until each was
  # bumped by hand. This repository could still merge, which is the whole of what
  # the deferral buys and the whole of why it is written down rather than left to
  # look like a repository nobody finished configuring.
  workflow-pins:
    uses: lemonfiber/spec/.github/workflows/workflow-pins.yml@60d130a3d799e4826111f9eeffa932b733bc22c3 # v1.0.16

  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@60d130a3d799e4826111f9eeffa932b733bc22c3 # v1.0.16

  labeler:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@60d130a3d799e4826111f9eeffa932b733bc22c3 # v1.0.16

  # The rules, before anything slower gets a chance to hide a boundary break.
  #
  # Arch and Templates read files and need neither a coverage driver nor a
  # database, so this is the cheapest job here and the one most likely to fail on
  # a change that is wrong rather than merely broken. Failing it first means a
  # reviewer sees "this crosses a module boundary" rather than a coverage number.
  rules:
    name: rules
    # Every change, documentation included. `tests/Arch` reads ARCHITECTURE.md
    # and `.docs/requirements/` against the code, so a documentation change is
    # exactly the change that can break it — and at about a minute it costs
    # less than any condition would save.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: vendor/bin/pest --testsuite=Arch,Templates

  # R2 — every rule refuses a planted violation.
  #
  # Its own job because it runs the analyser and the test suite as subprocesses,
  # once each, which is a full framework boot twice over. It plants into a copy
  # of the checkout under the runner's temporary directory, never into the
  # checkout itself.
  guards:
    name: the rules refuse violations
    needs: scope
    # `scope` deciding "no code changed" is a skip, and the gates are scoped so
    # that a documentation change does not start a PHP toolchain. `scope`
    # *failing* produces the same skip — a checkout that broke or a runner that
    # died leaves no output, and no output is not a "no".
    #
    # Either way that is wrong. If a skipped required check satisfies branch
    # protection, a pull request merges with none of these run and nothing red.
    # If it does not, the check never reports and the pull request is blocked
    # forever with nothing anywhere naming the cause. The job's own comments say
    # which way it means to fail — "No usable base commit, so every gate runs",
    # "a new kind of file defaults to running the gates" — and its own failure
    # was the one path that did the opposite.
    #
    # So the condition asks the result as well as the output.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer test:guards

  # Formatting, static analysis, dead idioms, the repository's own guards and
  # dependency hygiene. One install, one PHP, six commands, no coverage driver.
  checks:
    name: checks
    needs: scope
    # `scope` deciding "no code changed" is a skip, and the gates are scoped so
    # that a documentation change does not start a PHP toolchain. `scope`
    # *failing* produces the same skip — a checkout that broke or a runner that
    # died leaves no output, and no output is not a "no".
    #
    # Either way that is wrong. If a skipped required check satisfies branch
    # protection, a pull request merges with none of these run and nothing red.
    # If it does not, the check never reports and the pull request is blocked
    # forever with nothing anywhere naming the cause. The job's own comments say
    # which way it means to fail — "No usable base commit, so every gate runs",
    # "a new kind of file defaults to running the gates" — and its own failure
    # was the one path that did the opposite.
    #
    # So the condition asks the result as well as the output.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .phpstan-cache
            .rector-cache
          key: analysis-${{ runner.os }}-${{ github.sha }}
          restore-keys: analysis-${{ runner.os }}-
      # Cheapest first, so a misplaced brace fails in seconds rather than after
      # the analyser has walked the tree.
      - run: composer validate --strict
      - run: composer validate:modules
      - run: composer normalize --dry-run
      - run: composer normalize:modules
      - run: composer lint
      - run: composer analyse
      - run: composer refactor
      - run: composer deps
      - run: composer audit

  tests:
    name: tests and coverage
    needs: scope
    # `scope` deciding "no code changed" is a skip, and the gates are scoped so
    # that a documentation change does not start a PHP toolchain. `scope`
    # *failing* produces the same skip — a checkout that broke or a runner that
    # died leaves no output, and no output is not a "no".
    #
    # Either way that is wrong. If a skipped required check satisfies branch
    # protection, a pull request merges with none of these run and nothing red.
    # If it does not, the check never reports and the pull request is blocked
    # forever with nothing anywhere naming the cause. The job's own comments say
    # which way it means to fail — "No usable base commit, so every gate runs",
    # "a new kind of file defaults to running the gates" — and its own failure
    # was the one path that did the opposite.
    #
    # So the condition asks the result as well as the output.
    #
    # It runs on every event this workflow has. A merge group runs it exactly as
    # a pull request does, and that is the single most important property of
    # this job: left to `pull_request` alone it skips in the queue, a skipped
    # required check reports success, and the queue merges a batch the suite
    # was never run over. A push to `main` runs it because `sonar` below reads
    # its report to analyse `main`.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # Writes the clover report the floors gate reads. One run produces both
      # the global number and the fifteen per-tree ones. It also writes the
      # coverage map every mutation shard reads, and how long the run took,
      # which is what each mutant is timed out against: the shards open on the
      # canary rather than on this whole suite again. The upload below errors
      # only when none of its files exist, so a missing map is refused here.
      - run: |
          started=$SECONDS
          composer test:report
          echo $((SECONDS - started)) > coverage/suite-seconds
          test -s coverage/mutation.php || { echo "::error::test:report wrote no coverage map at coverage/mutation.php"; exit 1; }
      - run: composer test:floors
      # The same two reports are what `sonar` hands SonarCloud, so the suite
      # runs once for both.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage/clover.xml
            coverage/junit.xml
            coverage/mutation.php
            coverage/suite-seconds
          if-no-files-found: error
          retention-days: 1

  # Which shards to mutate, asked of the same script that mutates them. A list
  # written here would be a second source of truth that goes stale the day a
  # tree gains its first class — silently, because the run still passes, over
  # less.
  #
  # The dependencies are installed for one `--list`, which reads as waste and
  # is not. The script derives the trees from `phpunit.xml` through
  # `Tests\Support\MeasuredTree`, which is the same derivation the `Floors`
  # suite and `G7` read — and the only way a script reaches it is the
  # autoloader. The alternative is a second copy of "what is measured" written
  # out here in a file nothing compares against the first.
  #
  # It runs after `tests` and only once they pass, so it skips wherever
  # `tests` skips or fails, and a shard never starts over tests already red.
  #
  # On a pull request it lists only the shards the change reaches, and reads
  # that from git against the base commit, which is fetched for it. On `main`
  # it lists the shards reached since the last commit on `main` whose run of
  # this workflow passed, so a push a newer one cancelled is carried into the
  # newer one's reach rather than dropped, and a merge that reaches no code
  # mutates nothing. Where every commit in that range is the tree of a pull
  # request head whose own run passed, it lists none: the branch was up to
  # date, so its run judged exactly the tree that landed. Where no such commit
  # is found, every shard runs. On a
  # merge group it lists none: each pull request's own run judged the mutants
  # its change reaches, the queue's run of `tests` is what catches two changes
  # that break together, and the run on `main` mutates what they reach
  # together.
  #
  # A changed test reaches the code it executes, read from the coverage map
  # `tests` wrote, so the listing waits for `tests` — which the shards wait for
  # anyway. A test edited to assert less changes no line of what it judged,
  # and without the map that code would never be mutated against it again.
  mutation-scope:
    name: what to mutate
    needs: [scope, tests]
    if: ${{ !cancelled() && needs.tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      shards: ${{ steps.list.outputs.shards }}
      base: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - id: base
        name: The commit the change is measured against
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PULL_BASE: ${{ github.event.pull_request.base.sha }}
          PUSHED: ${{ github.sha }}
        run: |
          # Whether a commit on `main` is a tree its own pull request already
          # passed every gate on. `main` takes only up-to-date branches, so a
          # squash merge lands exactly the tree of the head it came from, and
          # that head's run mutated what the change reaches.
          proved() {
            local head
            head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/$1/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].head.sha // empty')" || return 1
            [ -n "${head}" ] || return 1
            [ "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${head}" --jq .tree.sha)" = "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$1" --jq .tree.sha)" ] || return 1
            [ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${head}&event=pull_request&status=success&per_page=1" --jq .total_count)" -gt 0 ]
          }

          case "${EVENT}" in
            pull_request) BASE="${PULL_BASE}" ;;
            push)
              BASE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty' || true)"
              # Where every commit since that run was proved by its own pull
              # request, there is nothing left to mutate. One commit that was
              # not, or a range too long to ask about, mutates all of it.
              if [ -n "${BASE}" ]; then
                commits="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${PUSHED}" --jq 'select(.status == "ahead" and .total_commits <= 20) | .commits[].sha' || true)"
                all=yes
                [ -n "${commits}" ] || all=""
                for commit in ${commits}; do
                  proved "${commit}" || { all=""; echo "${commit} is not a tree its pull request proved."; break; }
                done
                if [ -n "${all}" ]; then
                  echo "Every commit since ${BASE} is a tree its pull request proved, so nothing is mutated again." | tee -a "$GITHUB_STEP_SUMMARY"
                  BASE="${PUSHED}"
                fi
              fi
              ;;
            *) BASE="" ;;
          esac
          if [ -n "${BASE}" ] && git fetch --no-tags --depth=1 origin "${BASE}"; then
            echo "sha=${BASE}" >> "$GITHUB_OUTPUT"
          else
            echo "No usable base commit, so every shard runs."
          fi
      # The coverage map `tests` wrote, which says what a changed test executes.
      - if: github.event_name != 'merge_group'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-report
          path: coverage
      - id: list
        env:
          BASE: ${{ steps.base.outputs.sha }}
          EVENT: ${{ github.event_name }}
          MUTATION_SHARED_COVERAGE: ${{ github.workspace }}/coverage/mutation.php
        run: |
          if [ "$EVENT" = merge_group ]; then
            echo "A merge group mutates nothing: every pull request in it was mutated on its own run, and main mutates what they reach together."
            echo "shards=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "shards=$(php scripts/mutation.php --list ${BASE:+--changed-since="${BASE}"})" >> "$GITHUB_OUTPUT"

  # The most expensive gate in the repository, so it is the most guarded: only
  # once the tests have passed, and only over the app's own logic. Mutating code
  # whose tests are already failing measures nothing.
  #
  # A runner per shard, because this is the one gate whose work genuinely
  # separates: a floor of 100 admits no offsetting between files, so each is
  # already judged alone. `scripts/mutation.php` cuts the files of every tree
  # into shards of about the same measured mutation time, so the largest tree
  # is spread over several runners and the smallest share one; the wall clock
  # is the slowest shard.
  #
  # `fail-fast: false` because the point of a shard is to learn about all of
  # them: cancelling every other runner over one escaped mutant means a second
  # push to find the next one.
  mutation:
    name: mutation (${{ matrix.shard.label }})
    needs: [tests, mutation-scope]
    if: ${{ !cancelled() && needs.tests.result == 'success' && needs.mutation-scope.result == 'success' && needs.mutation-scope.outputs.shards != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.mutation-scope.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - name: The commit the change is measured against
        if: needs.mutation-scope.outputs.base != ''
        env:
          BASE: ${{ needs.mutation-scope.outputs.base }}
        run: git fetch --no-tags --depth=1 origin "${BASE}"
      # The coverage map `tests` wrote on this commit, so the shard does not run
      # the whole suite again to make its own.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-report
          path: coverage
      # The same `--changed-since` as the listing, so this cuts the shards the
      # matrix was built from.
      # What this shard's verdict depends on: its files, the tests that run
      # them, every file those tests run, and what no coverage map records —
      # see `proofOf()` in scripts/mutation.php. A shard whose proof passed
      # before, on this branch or on `main`, is not run again: a rebase over
      # changes that reach none of it proves nothing new. Empty where it
      # cannot be told, and then the shard always runs.
      - id: proof
        env:
          BASE: ${{ needs.mutation-scope.outputs.base }}
          SHARD: ${{ matrix.shard.id }}
          MUTATION_SHARED_COVERAGE: ${{ github.workspace }}/coverage/mutation.php
        run: |
          key=$(php scripts/mutation.php --shard="${SHARD}" --proof ${BASE:+--changed-since="${BASE}"})
          echo "key=${key}" >> "$GITHUB_OUTPUT"
      - id: proved
        if: steps.proof.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mutation-proved
          key: mutation-proved-${{ steps.proof.outputs.key }}
          lookup-only: true
      - if: steps.proved.outputs.cache-hit == 'true'
        env:
          KEY: ${{ steps.proof.outputs.key }}
        run: |
          echo "Proved already: every file this shard's verdict depends on is as it was when proof ${KEY} passed." | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.proved.outputs.cache-hit != 'true'
        env:
          BASE: ${{ needs.mutation-scope.outputs.base }}
          SHARD: ${{ matrix.shard.id }}
          MUTATION_SHARED_COVERAGE: ${{ github.workspace }}/coverage/mutation.php
        run: |
          MUTATION_SUITE_SECONDS="$(cat coverage/suite-seconds)" composer test:mutation -- --shard="${SHARD}" ${BASE:+--changed-since="${BASE}"}
      # Recorded only once the shard has passed, so a proof names a verdict
      # that held.
      - if: steps.proof.outputs.key != '' && steps.proved.outputs.cache-hit != 'true'
        env:
          KEY: ${{ steps.proof.outputs.key }}
        run: |
          mkdir -p .mutation-proved
          printf '%s\n' "${KEY}" > .mutation-proved/key
      - if: steps.proof.outputs.key != '' && steps.proved.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mutation-proved
          key: mutation-proved-${{ steps.proof.outputs.key }}

  # The check branch protection actually names.
  #
  # A matrix job reports one check per entry — `mutation (app-modules/kernel/src,
  # part 2 of 4)`, `mutation (paths a holds: group judges)` — and none of them
  # is called `mutation testing`. That required check would simply never
  # report, and a required check that never reports blocks a pull request
  # forever with nothing anywhere naming the cause. It is the same hole the
  # SonarCloud `gate` job exists to close, and it is reached here by renaming
  # rather than by a failure.
  #
  # So this job keeps the name and answers for the shards. `!cancelled()` rather
  # than `always()`: a cancelled run is somebody pressing stop.
  #
  # It asks the results rather than depending on them, for the reason every
  # other gate in this file does: `needs` alone makes a job disappear when what
  # it needs fails, which turns a red gate into a missing one.
  mutation-gate:
    name: mutation testing
    # `scope` is needed for its outputs rather than its work: this job has to
    # be able to tell a `tests` that skipped by design from one that skipped
    # because something upstream broke, and those two are indistinguishable
    # from `needs.tests.result` alone.
    needs: [scope, tests, mutation-scope, mutation]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: every tree that was mutated passed
        env:
          TESTS: ${{ needs.tests.result }}
          SCOPE: ${{ needs.mutation-scope.result }}
          SHARDS: ${{ needs.mutation.result }}
          EVENT: ${{ github.event_name }}
          SCOPED: ${{ needs.scope.result }}
          CHANGED: ${{ needs.scope.outputs.code }}
        run: |
          # `skipped` is a pass here and only here: the shards are skipped when
          # the change reaches no mutated file, or no measured tree holds code
          # yet, which `mutation-scope` reports as an empty list. Every other reason a shard does not run — a failure upstream,
          # a cancelled run — is already covered by the two results above it.
          echo "tests=$TESTS scope=$SCOPE shards=$SHARDS event=$EVENT scoped=$SCOPED changed=$CHANGED"

          # Mutation runs wherever the tests run: on every event, once a change
          # touches code. A documentation-only change skips both, deliberately,
          # and this job is downstream of that skip — without the check below a
          # documentation-only pull request could not merge at all, because
          # this is a required context and a required context that fails
          # blocks rather than skips.
          #
          # The skip is restated rather than inferred. `needs.tests.result`
          # says `skipped` whether the skip was intended or whether something
          # above it broke, and treating those alike is what would let a real
          # breakage pass as a quiet day. So this asks the question `tests`
          # asks, of the same inputs, and calls only that skip a pass.
          if [ "$TESTS" = skipped ] && [ "$SCOPED" = success ] && [ "$CHANGED" != true ]; then
            echo "Nothing to mutate: the tests did not run, and were not meant to."
            exit 0
          fi

          if [ "$TESTS" != success ] || [ "$SCOPE" != success ]; then
            echo "::error::Mutation did not run: the tests or the tree list did not pass."
            exit 1
          fi

          if [ "$SHARDS" != success ] && [ "$SHARDS" != skipped ]; then
            echo "::error::A shard's mutation run did not pass. Open the mutation (<shard>) job that is red."
            exit 1
          fi

  # SonarCloud, moved here from its own workflow so that it reads the report
  # `tests` writes instead of running the suite a second time.
  sonar:
    name: sonarcloud
    # A fork has no access to the token, and a job that cannot authenticate
    # should not report a red tick that nobody can fix.
    #
    # A merge group is named here rather than left to the fork comparison. Its
    # branch is this repository's own — the queue builds it here, never in a
    # fork — so the token is present and the scan can run; but the field that
    # comparison reads is `github.event.pull_request.head.repo.full_name`, which
    # is null on this event, and what a null compares equal to is not a rule a
    # required check should rest on. Unnamed, this job would skip in the queue,
    # and a skipped required check reports success.
    #
    # What the scan proves there is less than it proves on a pull request, and
    # saying so is cheaper than discovering it. There is no pull request for
    # SonarCloud to decorate, so the run is recorded against the queue's own
    # short-lived branch, and the gate below — which reads a pull request's
    # summary — skips. So in a merge group this check means the scan ran over
    # the merged tree and neither it nor the coverage run fell over. `Q-R64`
    # itself is enforced on the pull request, which cannot be queued while that
    # gate is red.
    #
    # It reads the report `tests` wrote rather than running the suite again.
    # Where `tests` skipped because nothing but documentation changed, there is
    # no report and no code for one to be about: on a pull request the scan
    # runs without it, because `sonarcloud` is required there, and on `main`
    # it skips, because an analysis of `main` without a report would set the
    # project's coverage to nothing. Where `tests` failed, this skips: the pull
    # request is already blocked on `tests and coverage`, and a scan without
    # coverage would read every new line as untested.
    needs: tests
    if: ${{ !cancelled() && (needs.tests.result == 'success' || (needs.tests.result == 'skipped' && github.event_name != 'push')) && (github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar reads history to attribute an issue to the change that
          # introduced it, which is what makes "new code" a usable gate.
          fetch-depth: 0
          persist-credentials: false

      - name: The coverage and test report `tests` wrote
        if: needs.tests.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-report
          path: coverage

      # A Dependabot run reads its secrets from the Dependabot store rather than
      # the Actions store, and `SONAR_TOKEN` lives only in the second. The
      # scanner was handed an empty string, died on "Not authorized or project
      # not found", and turned this job red over a step with nothing to do with
      # the bump. No dependency update in this repository has ever merged; #155
      # was the first one to try, and it sat on a stack trace about credentials
      # while the two action SHAs it carried were never in question.
      #
      # Skipped rather than left to fail: a scan that cannot authenticate has no
      # verdict to give, and a red tick meaning "the runner held no credential"
      # is worth less than a step that says so in a sentence. The coverage and
      # test report come from `tests and coverage`, which needs no token, so
      # what that check measures is unchanged on these pull requests.
      #
      # Keyed on who opened the pull request, because that is what selects the
      # secret store. Not `github.triggering_actor`, which becomes whoever
      # pressed re-run — keyed on that, this step would come back on the re-run
      # of a Dependabot pull request and fail it a second time.
      #
      # The event is named as well as the author. A push to main carries no pull
      # request, so the author field is null there, and what a null compares
      # equal to is not a rule this workflow should rest on: SonarCloud's
      # analysis of main is the baseline every pull request is measured against,
      # and a comparison that quietly went the other way would switch it off with
      # nothing anywhere to notice.
      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        id: scan
        if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Runs when the scan failed, and asks the one question its output does not
      # answer: was that this repository or the host?
      #
      # A scanner that cannot reach SonarCloud fails with a Spring bean-creation
      # trace forty lines deep and `Error 503` somewhere in the middle, and the
      # required check beside it goes red exactly as it does for a real finding.
      # On 2026-09-13 SonarCloud answered 503 for over an hour and fourteen pull
      # requests across the organisation sat blocked behind a stack trace nobody
      # had read to the middle of.
      #
      # It reports and changes nothing: the scan still failed, the check is still
      # red, and `Q-R64` was still not enforced on this run. What it adds is the
      # sentence that says which of those two things happened.
      - name: Whether SonarCloud was answering
        if: always() && steps.scan.outcome == 'failure'
        run: |
          set -uo pipefail
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 \
            https://sonarcloud.io/api/system/status 2>/dev/null || echo "000")

          # 000 is curl reaching nothing at all, which is the same news as a 5xx
          # for the purpose of this sentence.
          case "$code" in
          5?? | 000)
            said="The scan failed and SonarCloud answered ${code} to a plain status request, so the host was unavailable rather than this pull request being at fault. Coverage and the test report come from the tests and coverage job, which this scan does not change. Re-run this job once sonarcloud.io is answering — nothing on this run enforced Q-R64."
            ;;
          *)
            said="The scan failed and SonarCloud answered ${code} to a plain status request, so the host was reachable and the failure is in this run rather than an outage. Read the scanner output above. Nothing on this run enforced Q-R64."
            ;;
          esac

          echo "::notice::${said}"
          printf '### Why the SonarCloud scan failed\n\n%s\n' "$said" >> "$GITHUB_STEP_SUMMARY"

      # Runs in exactly the case the scan does not. A step absent from a log
      # reads the same as a step that ran and found nothing, and this repository
      # has been caught by that reading before, so the skip appears under its own
      # name carrying its reason and the identifier it was decided on.
      - name: Why the scan was skipped
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          said="The SonarCloud scan was skipped: ${AUTHOR} opened this pull request, and a Dependabot run reads secrets from the Dependabot store rather than the Actions store, so SONAR_TOKEN is empty here and the scanner could only have failed on it. Coverage and the test report come from the tests and coverage job, which this scan does not change. No analysis was produced, so nothing on this run enforced Q-R64."
          echo "::notice::${said}"
          printf '### SonarCloud scan skipped\n\n%s\n' "$said" >> "$GITHUB_STEP_SUMMARY"

  # Q-R64 — the check this repository was the only one in the estate without.
  #
  # The scan above produces the analysis; nothing here read it. SonarCloud's free
  # plan cannot express "zero issues" as a quality gate condition, so a green
  # `SonarCloud Code Analysis` tick means the *quality gate* passed, not that the
  # project is clean — and this repository merged a pull request with two issues
  # standing open under exactly that tick. `php:S1186` on an empty constructor and
  # `php:S1142` on a method with four returns, both reported, both unread, because
  # no check in this repository ever asked for the number.
  #
  # Every other repository here calls the shared reusable in `spec`, which asks
  # both questions Q-R64 needs — new issues on this pull request, and open issues
  # against the project — and blocks on either. One definition, so a repository
  # cannot drift into gating differently from its neighbours, and so a fix to the
  # gate reaches all of them at once.
  gate:
    # No `name:`, deliberately. The required-check context is built from the job
    # ids — `gate / gate` — and every other repository here is protected under
    # exactly that string. A display name would rename the context and leave
    # this repository's branch protection pointing at a check that never
    # reports, which is the same hole this file exists to close.
    #
    # After the scan, so there is a summary to read. Without this the gate polls
    # for a comment the scan has not been started to produce yet and spends its
    # whole timeout waiting for one.
    needs: sonar
    # Ordering only, though. `needs` on its own also makes this job disappear
    # when the scan fails, and a required check that never reports blocks a pull
    # request with no line anywhere saying by what — the very hole the comment
    # above says this file exists to close, reopened from the other side. On
    # 2026-09-13 SonarCloud answered 503 for over an hour and every pull request
    # in the organisation sat on `MISSING: gate / gate`, while the job written to
    # explain exactly that was never scheduled to say it.
    #
    # Nothing is loosened by running it anyway: a failed scan leaves `sonar` red,
    # and `sonar` is a required check in its own right, so the pull request stays
    # blocked for the reason it should be. The gate then does what it always did
    # with no summary to read — warns, says Q-R64 went unenforced, and passes.
    #
    # `!cancelled()` rather than `always()`: a cancelled run is somebody pressing
    # stop, and finishing the job they stopped serves nobody.
    #
    # On a merge group `gate / gate` judges the batch: it reads the new-issue
    # count SonarCloud reported for every pull request in it — each named by
    # the `(#N)` its squashed subject ends with — and the project's open count
    # against `allowed-open`, and refuses anything it cannot read, so `Q-R64`
    # holds on what the queue merges and not only on each pull request alone.
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/sonar-gate.yml@60d130a3d799e4826111f9eeffa932b733bc22c3 # v1.0.16
    with:
      # Nothing, which is now true: `main` carries zero open issues, and the two
      # it did carry went out with the commit that installed this gate.
      #
      # This is what the previous value was for. `allowed-open` is a ceiling and
      # not a budget — the shared gate refuses any raise past the count actually
      # standing against the base branch — so a repository installs the gate at
      # whatever it inherited and walks it down. Two was the honest number for
      # one merge; zero is the honest number now, and from here the gate refuses
      # the first issue rather than the first issue past a tolerance.
      allowed-open: 0
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}

  # Records that every PHP gate passed on this tree, so a later run on the same
  # tree — see `scope` — does not test it again. Only where the gates actually
  # ran and every one of them passed: a skipped gate proved nothing.
  proved-tree:
    name: record the proven tree
    needs: [scope, guards, checks, tests, mutation-gate, sonar]
    if: ${{ !cancelled() && needs.scope.outputs.code == 'true' && needs.guards.result == 'success' && needs.checks.result == 'success' && needs.tests.result == 'success' && needs.mutation-gate.result == 'success' && (needs.sonar.result == 'success' || needs.sonar.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          TREE: ${{ needs.scope.outputs.tree }}
        run: |
          mkdir -p .ci-proved
          printf '%s\n' "${TREE}" > .ci-proved/tree
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-proved
          key: ci-proved-tree-${{ needs.scope.outputs.tree }}

