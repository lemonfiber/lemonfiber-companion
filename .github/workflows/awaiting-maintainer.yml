# The maintainer queue flag. Triggers are declared here because a reusable
# cannot declare its caller's; the behaviour lives in the spec repo. OPS-R26, OPS-R27.
#
# The list below is also the wait list. The flag only goes up once every check
# `main` requires has passed, and the reusable reads this same list back out of
# this file to know what it must see finish first — so a workflow missing from it
# is a workflow the gate never waits for and never re-evaluates on. `main`
# requires twenty checks here and they come from three workflows:
#
#   ci         spec-check / spec-check, dco / dco, commitlint / commitlint,
#              hygiene / {actionlint, invite, links, markdown, pins,
#              shared-files, typos}, security / {gitleaks, osv-scanner},
#              checks, rules, the rules refuse violations,
#              tests and coverage, mutation testing
#   sonar      gate / gate
#   sdk-drift  sdk-drift
#
# `SonarCloud Code Analysis` is required too and is posted by the SonarCloud app
# rather than by a workflow, so it cannot be waited for by name; `gate / gate`
# reads that summary and cannot succeed before it exists.
#
# `sdk-drift` is the one this repository has that its siblings do not, and it is
# the reason this file could not simply be copied from one of them: a flag raised
# without waiting for it would go up on a pull request whose locked client is
# behind, which is the state `sdk-bump` exists to take off an author's hands.
#
# Add a workflow to branch protection and it belongs here in the same change.
name: awaiting-maintainer
on:
  workflow_run:
  # `codeql` is here because of what its `alerts` job does rather than because a
  # required context comes from it. That job refuses a branch an open alert
  # stands against; a gating workflow left out of this list can be the last one
  # to finish, with nothing afterwards to notice the pull request became
  # mergeable — the flag never goes up and nothing says why. Naming it costs one
  # more evaluation and means the list is already right on the day it is
  # required.
    workflows: [ci, sonar, sdk-drift, codeql]
    types: [completed]
  pull_request_review:
    types: [submitted]
  # Fork PRs carry a read-only token under `pull_request`, so the close event has
  # to run in the base repo's context to be able to edit a label at all.
  pull_request_target:
    types: [closed]
permissions:
  contents: read

jobs:
  awaiting:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/awaiting-maintainer.yml@a269e7f347ed92988cbf03394130b6fee93347da # main
    secrets:
      DISCORD_MAINTAINERS_WEBHOOK: ${{ secrets.DISCORD_MAINTAINERS_WEBHOOK }}
