# The maintainer queue flag. Triggers are declared here because a reusable
# cannot declare its caller's; the behaviour lives in the spec repo. OPS-R26, OPS-R27.
#
# The list below is also the wait list. The flag only goes up once every check
# `main` requires has passed, and the reusable reads this same list back out of
# this file to know what it must see finish first — so a workflow missing from it
# is a workflow the gate never waits for and never re-evaluates on. `main`
# requires twenty-two checks here and they come from three workflows:
#
#   ci         spec-check / spec-check, dco / dco, attribution / attribution,
#              commitlint / commitlint, hygiene / {actionlint, invite, links,
#              markdown, pins, shared-files, typos},
#              security / {gitleaks, osv-scanner},
#              checks, rules, the rules refuse violations,
#              tests and coverage, mutation testing,
#              gate / gate, sonarcloud
#   sdk-drift  sdk-drift
#   codeql     alerts / alerts
#
# `sonarcloud` is there in place of `SonarCloud Code Analysis`, which the
# SonarCloud app posts rather than a workflow. That tick cannot appear at all on
# a Dependabot pull request — such a run reads the Dependabot secret store, has
# no `SONAR_TOKEN`, and so produces no analysis for the app to have an opinion
# about — and a required check that can never report blocked every dependency
# update this repository opened. `sonarcloud` is the job this repository owns: it
# reports on every pull request, it goes red when a scan genuinely fails, and
# being a workflow it can be waited for by name. The app still posts its tick and
# it is still worth reading; it is no longer the thing holding the branch.
# `gate / gate` is what enforces Q-R64 either way.
#
# `sdk-drift` is the one this repository has that its siblings do not, and it is
# the reason this file could not simply be copied from one of them: a flag raised
# without waiting for it would go up on a pull request whose locked client is
# behind, which is the state `sdk-bump` exists to take off an author's hands.
#
# Add a workflow to branch protection and it belongs here in the same change.
#
# All three also run on `merge_group`, and their merge-group runs reach this gate
# too. Nothing here needs to know that: the reusable asks which pull request the
# head commit belongs to, a merge group's head is a commit the queue built that
# belongs to none, and it says so and stops. The flag is about a pull request
# waiting for a maintainer, and by the time a merge group exists that wait is
# over.
name: awaiting-maintainer
on:
  workflow_run:
  # `codeql` was named here before a required context came from it, on the
  # grounds that its `alerts` job refuses a branch an open alert stands against
  # and a gating workflow left out of this list can be the last one to finish,
  # with nothing afterwards to notice the pull request became mergeable. That day
  # has since arrived: `alerts / alerts` is required, and the list was already
  # right, which is the whole argument for naming a gating workflow early.
    workflows: [ci, sdk-drift, codeql]
    types: [completed]
  pull_request_review:
    types: [submitted]
  # Fork PRs carry a read-only token under `pull_request`, so the close event has
  # to run in the base repo's context to be able to edit a label at all.
  pull_request_target:
    types: [closed]
permissions:
  contents: read

jobs:
  awaiting:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/awaiting-maintainer.yml@60d130a3d799e4826111f9eeffa932b733bc22c3 # v1.0.16
    secrets:
      DISCORD_MAINTAINERS_WEBHOOK: ${{ secrets.DISCORD_MAINTAINERS_WEBHOOK }}
