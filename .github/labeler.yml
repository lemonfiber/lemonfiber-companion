documentation:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md', '.docs/**']
ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/workflows/**']
dependencies:
  # Twelve module manifests sit under `app-modules/*/composer.json` beside the
  # root one, and a Dependabot update reaches any of them. The siblings name
  # their manifest without a glob because they have exactly one.
  - changed-files:
      - any-glob-to-any-file:
          ['composer.json', 'composer.lock', '**/composer.json', '.github/dependabot.yml']
