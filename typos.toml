# Canonical typos configuration for every lemonfiber repo.
#
# Unlike the markdownlint config, this one is a floor rather than a copy: a repo
# may add words and patterns its own tree needs, but every entry below must be
# present with the same value. The `shared-files` job in the hygiene gate checks
# that (GOV-R12, Q-R56).
#
# A repo starting from scratch copies this file to its root as `typos.toml` and
# adds to it.

[default]
# Ignore hotkey mockup notation like [e]rror, [s]ervice in TUI examples.
extend-ignore-re = ["\\[[a-z]\\][a-zA-Z]+"]

[default.extend-words]
ratatui = "ratatui"
Ratatui = "Ratatui"
lemonfiber = "lemonfiber"
Servarr = "Servarr"

# --- what this repository adds -------------------------------------------
#
# Everything above is the canonical floor and is byte-identical across the
# estate. What follows is this tree's own, which the floor explicitly permits.

[files]
# The checker's dictionary is English, and a Dutch sentence is a run of words it
# does not have — `certificaat`, `koppelingscode`, `vergrendeld`. Enumerating
# them would be a second Dutch dictionary to maintain and would go stale the
# first time a sentence is rewritten. The English catalogue stays checked,
# because that is where a typo an operator can see would be.
#
# A locale added here needs a line here too, and LocaleParityTest fails if one
# is missing rather than leaving the omission to be noticed.
# The decision records live under `.docs/`, which is the estate's convention
# (`lemonfiber` and `brand` keep theirs there too) and is a directory this
# checker skips by default — so moving them there would have quietly taken them
# out of the spell check. `.git` has to come back out by hand once hidden files
# are in: its object files are compressed binary, and the checker reads them as
# seventy-odd misspellings that no edit can ever fix.
#
# The rest of what this admits is a gain rather than a cost: the workflows, the
# hooks and this file's neighbours are now checked too, and were not before.
ignore-hidden = false
extend-exclude = ["lang/nl/", ".git/"]

[default.extend-identifiers]
# Pest's own expectation is spelled this way; the stub mirrors its API rather
# than correcting it.
toBeInvokable = "toBeInvokable"
