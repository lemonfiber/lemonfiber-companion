# SonarCloud, which Q-R64 requires to report zero issues.
#
# The analyser here is a backstop rather than the gate: PHPStan, Pint, Rector
# and tests/Arch run on a laptop and fail in seconds, and anything Sonar finds
# that they did not is a rule this repository is missing. The value is in that
# gap, so the project is configured to see all of the code rather than a
# convenient subset.

sonar.projectKey=lemonfiber_lemonfiber-companion
sonar.organization=lemonfiber
sonar.projectName=lemonfiber-companion

# Every module's source, plus the composition root and the native expansion's
# own PHP. The application is twelve modules and one root; pointing Sonar at the
# root alone would measure it and report a clean project while the modules went
# unread.
#
# This list is one of eleven places the composition root's path is written down,
# and the last one found when it moved out of `app/` — by the scan failing with
# "The folder 'app' does not exist", which is the right way for a path to be
# wrong: loudly, naming the path, on the pull request that moved it.
sonar.sources=bootstrap/Composition,app-modules,config,routes,lang,native/src
sonar.tests=tests

# A module's own tests sit inside `app-modules/<name>/tests`, which is under a
# source root. Sonar takes no wildcard in `sonar.tests`, so they are excluded
# from sources here rather than listed twelve times — a list that would need a
# thirteenth line the day a module is added, and would be wrong until someone
# noticed.
sonar.exclusions=app-modules/*/tests/**,native/tests/**,vendor/**,bootstrap/cache/**,storage/**

# The locale catalogues are excluded from copy-paste detection, and only from
# that. Two locales are the same list of keys with different sentences after
# them — `LocaleParityTest` fails when they are not — so a detector that works on
# token shape reports every catalogue as a copy of every other, and reports it
# again on every row added. The duplication is the requirement here, which is
# the one case where the measurement is wrong rather than the code.
#
# Narrow on purpose: everything else about `lang/` is still analysed, and every
# other path is still checked for duplication.
sonar.cpd.exclusions=lang/**

sonar.php.coverage.reportPaths=coverage/clover.xml
sonar.php.tests.reportPath=coverage/junit.xml

sonar.sourceEncoding=UTF-8
